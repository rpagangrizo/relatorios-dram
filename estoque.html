<script>
  // cadeado: exige login antes de mostrar a pagina. Sem sessao valida
  // (ou expirada), manda direto pra tela de login, antes de qualquer
  // conteudo aparecer.
  (function verificarLogin() {
    try {
      var sessao = JSON.parse(localStorage.getItem("dram_auth") || "null");
      if (!sessao || sessao.expira_em <= Date.now()) {
        window.location.href = "index.html";
      }
    } catch (erro) {
      window.location.href = "index.html";
    }
  })();

<script>
const SUPABASE_URL = "https://ictjslaiumgaiphkcxdx.supabase.co";
const SUPABASE_KEY = "sb_publishable_Q0mPbsj_qfJ5UqWvvxk2Ww_y2gfm6xX";


async function chamarSupabase(caminho) {
  const resposta = await fetch(`${SUPABASE_URL}/rest/v1/${caminho}`, {
    headers: {
      "apikey": SUPABASE_KEY,
      "Authorization": `Bearer ${SUPABASE_KEY}`,
    },
  });
  if (!resposta.ok) {
    throw new Error(`Erro ${resposta.status} ao buscar ${caminho}`);
  }
  return resposta.json();
}

function celulaSelo(qtd) {
  const classe = qtd > 0 ? "tem" : "zerado";
  const texto = qtd.toLocaleString("pt-BR", { minimumFractionDigits: 0, maximumFractionDigits: 2 });
  return `<span class="selo ${classe}">${texto}</span>`;
}

// dentro de uma mesma categoria (ex: Polpas), itens de embalagem "100g"
// vem antes dos de "barra"; dentro de cada grupo, ordem alfabética.
function compararItensPorEmbalagemENome(a, b) {
  const pesoA = a.embalagem === "100g" ? 0 : 1;
  const pesoB = b.embalagem === "100g" ? 0 : 1;
  if (pesoA !== pesoB) return pesoA - pesoB;
  // dentro do mesmo grupo (100g ou barra), produtos "Sandro" vao depois
  // dos sabores normais, e "caixa mista" (ex: "Manga/Acerola") vai
  // sempre por ultimo de todos - e' um produto diferente dentro da mesma
  // embalagem, nao um sabor puro. O "/" e' procurado so' na parte do
  // nome ANTES do " - " (onde fica o sabor) - depois disso vem sempre
  // "CX c/ ..." (o "c/" de "com"), que tambem tem uma barra e daria
  // falso positivo se checasse o nome inteiro.
  const sandroA = a.nome.toLowerCase().includes("sandro") ? 1 : 0;
  const sandroB = b.nome.toLowerCase().includes("sandro") ? 1 : 0;
  if (sandroA !== sandroB) return sandroA - sandroB;
  const mistaA = a.nome.split(" - ")[0].includes("/") ? 1 : 0;
  const mistaB = b.nome.split(" - ")[0].includes("/") ? 1 : 0;
  if (mistaA !== mistaB) return mistaA - mistaB;
  return a.nome.localeCompare(b.nome, "pt-BR");
}

let dadosProdutoAcabado = null; // { itens: [...], depositos: [...], saldos: Map }
let dadosMateriaPrima = null;   // { itens: [...], saldos: Map }

async function carregarProdutoAcabado() {
  const alvo = document.getElementById("conteudo-acabado");
  try {
    const [itens, depositos, estoque, categorias] = await Promise.all([
      chamarSupabase("itens?select=id,nome,categoria_produto_id,embalagem&order=nome"),
      chamarSupabase("depositos?select=id,nome&order=id"),
      chamarSupabase("estoque_produto_acabado?select=item_id,deposito_id,quantidade"),
      chamarSupabase("categorias_produto?select=id,nome&order=id"),
    ]);

    const saldos = new Map(); // "itemId-depositoId" -> quantidade
    for (const linha of estoque) {
      saldos.set(`${linha.item_id}-${linha.deposito_id}`, Number(linha.quantidade));
    }

    dadosProdutoAcabado = { itens, depositos, saldos, categorias };
    desenharProdutoAcabado("");
    popularSeletorDeposito(depositos);
  } catch (erro) {
    alvo.innerHTML = `<div class="erro">Não consegui carregar o estoque. ${erro.message}</div>`;
  }
}

function popularSeletorDeposito(depositos) {
  const select = document.getElementById("select-deposito-exportar");
  select.innerHTML = `<option value="todos">Consolidado (todos)</option>` +
    depositos.map(d => `<option value="${d.id}">${d.nome}</option>`).join("");
}

function desenharProdutoAcabado(filtro) {
  const alvo = document.getElementById("conteudo-acabado");
  const { itens, depositos, saldos, categorias } = dadosProdutoAcabado;
  const itensFiltrados = itens.filter(i => i.nome.toLowerCase().includes(filtro.toLowerCase()));

  if (itensFiltrados.length === 0) {
    alvo.innerHTML = `<div class="vazio">Nenhum item encontrado.</div>`;
    return;
  }

  // agrupa por categoria (na ordem em que as categorias foram cadastradas,
  // igual ja fazemos nos outros relatorios: Polpas, Frutas, Salgados...),
  // e ordena os itens dentro de cada categoria: 100g antes de barra, e
  // dentro de cada uma dessas, ordem alfabetica
  const nomeCategoriaPorId = new Map(categorias.map(c => [c.id, c.nome]));
  const gruposPorCategoria = new Map(); // categoria_id (ou 'sem') -> [itens]
  for (const item of itensFiltrados) {
    const chave = item.categoria_produto_id ?? "sem";
    if (!gruposPorCategoria.has(chave)) gruposPorCategoria.set(chave, []);
    gruposPorCategoria.get(chave).push(item);
  }
  for (const lista of gruposPorCategoria.values()) {
    lista.sort(compararItensPorEmbalagemENome);
  }

  const ordemCategorias = [...categorias.map(c => c.id), "sem"].filter(id => gruposPorCategoria.has(id));

  let html = `<table><thead><tr><th>Item</th>`;
  for (const dep of depositos) {
    html += `<th class="num">${dep.nome}</th>`;
  }
  html += `<th class="num">Total</th></tr></thead><tbody>`;

  for (const categoriaId of ordemCategorias) {
    const nomeCategoria = categoriaId === "sem" ? "Sem categoria" : nomeCategoriaPorId.get(categoriaId);
    const numColunas = depositos.length + 2;
    html += `<tr class="linha-categoria"><td colspan="${numColunas}">${nomeCategoria}</td></tr>`;

    for (const item of gruposPorCategoria.get(categoriaId)) {
      html += `<tr><td>${item.nome}</td>`;
      let total = 0;
      for (const dep of depositos) {
        const qtd = saldos.get(`${item.id}-${dep.id}`) || 0;
        total += qtd;
        html += `<td class="num">${celulaSelo(qtd)}</td>`;
      }
      html += `<td class="num total">${celulaSelo(total)}</td></tr>`;
    }
  }
  html += `</tbody></table>`;
  alvo.innerHTML = html;
}

async function carregarMateriaPrima() {
  const alvo = document.getElementById("conteudo-materia");
  try {
    const [itens, estoque] = await Promise.all([
      chamarSupabase("itens_materia_prima?select=id,nome,custo_medio&order=nome"),
      chamarSupabase("estoque_materia_prima?select=item_id,quantidade"),
    ]);
    const saldos = new Map();
    for (const linha of estoque) {
      saldos.set(linha.item_id, Number(linha.quantidade));
    }

    // busca os lotes separado, com fallback seguro - se a tabela ainda nao
    // existir (migracao de lote ainda nao rodou), so' nao mostra o
    // detalhamento por lote, sem quebrar a tela toda
    let lotesPorItem = new Map();
    try {
      const lotes = await chamarSupabase(
        "estoque_materia_prima_lote?select=item_id,lote,tipo_embalagem,capacidade_kg,quantidade_unidades,peso_total_kg&order=lote",
      );
      for (const l of lotes) {
        if (!lotesPorItem.has(l.item_id)) lotesPorItem.set(l.item_id, []);
        lotesPorItem.get(l.item_id).push(l);
      }
    } catch {
      // tabela ainda nao existe - segue sem detalhamento de lote
    }

    dadosMateriaPrima = { itens, saldos, lotesPorItem };
    desenharMateriaPrima("");
  } catch (erro) {
    alvo.innerHTML = `<div class="erro">Não consegui carregar a matéria-prima. ${erro.message}</div>`;
  }
}

function formatarMoeda(valor) {
  return "R$ " + Number(valor || 0).toFixed(2).replace(".", ",");
}

function desenharMateriaPrima(filtro) {
  const alvo = document.getElementById("conteudo-materia");
  const { itens, saldos, lotesPorItem } = dadosMateriaPrima;
  const itensFiltrados = itens.filter(i => i.nome.toLowerCase().includes(filtro.toLowerCase()));

  if (itensFiltrados.length === 0) {
    alvo.innerHTML = itens.length === 0
      ? `<div class="vazio">Nenhum item de matéria-prima cadastrado ainda.</div>`
      : `<div class="vazio">Nenhum item encontrado.</div>`;
    return;
  }

  let html = `<table><thead><tr><th>Item / Lote</th><th class="num">Quantidade</th><th class="num">Custo médio</th></tr></thead><tbody>`;
  for (const item of itensFiltrados) {
    const qtd = saldos.get(item.id) || 0;
    const custoTexto = item.custo_medio !== null && item.custo_medio !== undefined
      ? formatarMoeda(item.custo_medio) : "—";
    // nome do item e' clicavel - so' corrige erro de digitacao, nunca mexe
    // em quantidade (isso so' muda por entrada/saida, na tela de Ajustar Estoque)
    html += `<tr><td><span class="texto-editavel" data-acao="editar-nome-item" data-item-id="${item.id}" title="Clique pra corrigir o nome">${item.nome} ✎</span></td><td class="num">${celulaSelo(qtd)}</td><td class="num">${custoTexto}</td></tr>`;

    // sub-linhas: um lote pode ter mais de uma embalagem (ex: mesmo lote
    // com tambores de 190kg E sacos de 25kg) - cada combinacao vira uma
    // linha propria, so' mostra as que ainda tem saldo
    const lotesDoItem = (lotesPorItem.get(item.id) || []).filter(l => l.quantidade_unidades > 0);
    for (const lote of lotesDoItem) {
      // texto do lote tambem e' clicavel - corrige so' o texto do lote,
      // aplicando em todas as embalagens que compartilham esse mesmo lote
      html += `<tr class="linha-lote">
        <td class="celula-lote"><span class="texto-editavel" data-acao="editar-lote" data-item-id="${item.id}" data-lote-atual="${lote.lote}" title="Clique pra corrigir o nome do lote">Lote ${lote.lote}</span> — ${lote.tipo_embalagem} ${Number(lote.capacidade_kg)}kg</td>
        <td class="num">${lote.quantidade_unidades} un. (${Number(lote.peso_total_kg).toLocaleString("pt-BR")} kg)</td>
        <td class="num">—</td>
      </tr>`;
    }
  }
  html += `</tbody></table>`;
  alvo.innerHTML = html;

  alvo.querySelectorAll('[data-acao="editar-nome-item"]').forEach(span => {
    span.addEventListener("click", () => editarNomeItem(Number(span.dataset.itemId)));
  });
  alvo.querySelectorAll('[data-acao="editar-lote"]').forEach(span => {
    span.addEventListener("click", () => editarLote(Number(span.dataset.itemId), span.dataset.loteAtual));
  });
}

// corrige so' o NOME do item (erro de digitacao) - nunca mexe em
// quantidade, que so' muda por entrada/saida em Ajustar Estoque
async function editarNomeItem(itemId) {
  alert("DEBUG: editarNomeItem foi chamada, itemId=" + itemId);
  const item = dadosMateriaPrima.itens.find(i => i.id === itemId);
  if (!item) return;
  const novoNome = window.prompt("Corrigir nome do item:", item.nome);
  if (novoNome === null || !novoNome.trim()) return; // cancelou ou deixou vazio

  try {
    const atualizados = await chamarSupabase(`itens_materia_prima?id=eq.${itemId}`, {
      method: "PATCH",
      headers: { "Prefer": "return=representation" },
      body: JSON.stringify({ nome: novoNome.trim() }),
    });
    if (!atualizados || atualizados.length === 0) {
      alert("Não encontrei esse item pra atualizar (id não bateu com nada no banco).");
      return;
    }
    await carregarMateriaPrima();
  } catch (erro) {
    alert(`Não consegui corrigir: ${erro.message}`);
  }
}

// corrige so' o TEXTO do lote (erro de digitacao) - aplica em todas as
// embalagens que compartilham esse mesmo lote (ex: se o lote "L0001" tem
// tambor E saco, os dois viram "L001" juntos, sem separar os dois)
async function editarLote(itemId, loteAtual) {
  const novoLote = window.prompt("Corrigir texto do lote:", loteAtual);
  if (novoLote === null || !novoLote.trim()) return; // cancelou ou deixou vazio

  try {
    const atualizados = await chamarSupabase(
      `estoque_materia_prima_lote?item_id=eq.${itemId}&lote=eq.${encodeURIComponent(loteAtual)}`,
      {
        method: "PATCH",
        headers: { "Prefer": "return=representation" },
        body: JSON.stringify({ lote: novoLote.trim() }),
      },
    );
    if (!atualizados || atualizados.length === 0) {
      alert(`Não encontrei nenhuma linha com o lote "${loteAtual}" pra esse item — o filtro não bateu com nada no banco.`);
      return;
    }
    await carregarMateriaPrima();
  } catch (erro) {
    alert(`Não consegui corrigir: ${erro.message}`);
  }
}

document.getElementById("campo-busca").addEventListener("input", (evento) => {
  const filtro = evento.target.value;
  if (dadosProdutoAcabado) desenharProdutoAcabado(filtro);
  if (dadosMateriaPrima) desenharMateriaPrima(filtro);
});

document.querySelectorAll(".abas button").forEach((botao) => {
  botao.addEventListener("click", () => {
    document.querySelectorAll(".abas button").forEach(b => b.classList.remove("ativa"));
    botao.classList.add("ativa");
    const aba = botao.dataset.aba;
    document.getElementById("secao-acabado").style.display = aba === "acabado" ? "" : "none";
    document.getElementById("secao-materia").style.display = aba === "materia" ? "" : "none";
  });
});

document.getElementById("botao-exportar-excel").addEventListener("click", () => {
  const botao = document.getElementById("botao-exportar-excel");
  if (!dadosProdutoAcabado) return;
  botao.disabled = true;
  botao.textContent = "Gerando...";
  try {
    exportarEstoqueParaExcel();
  } catch (erro) {
    alert(`Não consegui gerar o Excel: ${erro.message}`);
  } finally {
    botao.disabled = false;
    botao.textContent = "⬇️ Exportar Excel";
  }
});

function exportarEstoqueParaExcel() {
  const { itens, depositos, saldos, categorias } = dadosProdutoAcabado;
  const filtroDeposito = document.getElementById("select-deposito-exportar").value;
  const filtroTexto = document.getElementById("campo-busca").value.trim().toLowerCase();

  const depositosParaExportar = filtroDeposito === "todos"
    ? depositos
    : depositos.filter(d => String(d.id) === filtroDeposito);

  const itensFiltrados = itens.filter(i => i.nome.toLowerCase().includes(filtroTexto));

  // mesmo agrupamento/ordenacao da tela: por categoria, depois embalagem
  // (100g antes de barra, "Sandro" por ultimo), depois alfabetico
  const nomeCategoriaPorId = new Map(categorias.map(c => [c.id, c.nome]));
  const gruposPorCategoria = new Map();
  for (const item of itensFiltrados) {
    const chave = item.categoria_produto_id ?? "sem";
    if (!gruposPorCategoria.has(chave)) gruposPorCategoria.set(chave, []);
    gruposPorCategoria.get(chave).push(item);
  }
  for (const lista of gruposPorCategoria.values()) {
    lista.sort(compararItensPorEmbalagemENome);
  }
  const ordemCategorias = [...categorias.map(c => c.id), "sem"].filter(id => gruposPorCategoria.has(id));

  const mostraTotal = depositosParaExportar.length > 1;
  const linhas = [];
  linhas.push(["Categoria", "Item", ...depositosParaExportar.map(d => d.nome), ...(mostraTotal ? ["Total"] : [])]);

  for (const categoriaId of ordemCategorias) {
    const nomeCategoria = categoriaId === "sem" ? "Sem categoria" : nomeCategoriaPorId.get(categoriaId);
    for (const item of gruposPorCategoria.get(categoriaId)) {
      const linha = [nomeCategoria, item.nome];
      let total = 0;
      for (const dep of depositosParaExportar) {
        const qtd = saldos.get(`${item.id}-${dep.id}`) || 0;
        linha.push(qtd);
        total += qtd;
      }
      if (mostraTotal) linha.push(total);
      linhas.push(linha);
    }
  }

  const planilha = XLSX.utils.aoa_to_sheet(linhas);
  planilha["!cols"] = [{ wch: 16 }, { wch: 34 }, ...depositosParaExportar.map(() => ({ wch: 14 })), ...(mostraTotal ? [{ wch: 12 }] : [])];

  const pasta = XLSX.utils.book_new();
  const nomeAba = filtroDeposito === "todos" ? "Consolidado" : (depositosParaExportar[0]?.nome || "Estoque").slice(0, 28);
  XLSX.utils.book_append_sheet(pasta, planilha, nomeAba);

  const hoje = new Date().toISOString().slice(0, 10);
  const sufixo = filtroDeposito === "todos" ? "consolidado" : nomeAba.toLowerCase().replace(/\s+/g, "-");
  XLSX.writeFile(pasta, `estoque_${sufixo}_${hoje}.xlsx`);
}

document.getElementById("botao-exportar-excel-materia").addEventListener("click", () => {
  const botao = document.getElementById("botao-exportar-excel-materia");
  if (!dadosMateriaPrima) return;
  botao.disabled = true;
  botao.textContent = "Gerando...";
  try {
    exportarMateriaPrimaParaExcel();
  } catch (erro) {
    alert(`Não consegui gerar o Excel: ${erro.message}`);
  } finally {
    botao.disabled = false;
    botao.textContent = "⬇️ Exportar Excel";
  }
});

function exportarMateriaPrimaParaExcel() {
  const { itens, saldos, lotesPorItem } = dadosMateriaPrima;
  const filtroTexto = document.getElementById("campo-busca").value.trim().toLowerCase();
  const itensFiltrados = itens.filter(i => i.nome.toLowerCase().includes(filtroTexto));

  const linhas = [["Item", "Lote", "Tipo de embalagem", "Capacidade (kg)", "Nº de unidades", "Quantidade (kg)", "Custo médio (R$)"]];
  for (const item of itensFiltrados) {
    const qtd = saldos.get(item.id) || 0;
    const custo = item.custo_medio !== null && item.custo_medio !== undefined ? Number(item.custo_medio) : "";
    // linha de resumo do item (sem lote preenchido)
    linhas.push([item.nome, "", "", "", "", qtd, custo]);

    // uma linha por lote/embalagem - repete o nome do item, pra filtro e
    // ordenacao continuarem funcionando normal na planilha
    const lotesDoItem = (lotesPorItem.get(item.id) || []).filter(l => l.quantidade_unidades > 0);
    for (const lote of lotesDoItem) {
      linhas.push([
        item.nome, lote.lote, lote.tipo_embalagem, Number(lote.capacidade_kg),
        lote.quantidade_unidades, Number(lote.peso_total_kg), "",
      ]);
    }
  }

  const planilha = XLSX.utils.aoa_to_sheet(linhas);
  planilha["!cols"] = [{ wch: 34 }, { wch: 12 }, { wch: 16 }, { wch: 14 }, { wch: 12 }, { wch: 14 }, { wch: 16 }];

  const pasta = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(pasta, planilha, "Matéria-Prima");

  const hoje = new Date().toISOString().slice(0, 10);
  XLSX.writeFile(pasta, `materia_prima_${hoje}.xlsx`);
}

carregarProdutoAcabado();
carregarMateriaPrima();
</script>
