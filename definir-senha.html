<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DRAM Web - Definir Senha</title>
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#1B4F72">
<style>
  :root {
    --azul: #1B4F72; --laranja: #D9662F; --laranja-escuro: #B84F1F;
    --fundo: #EEF2F4; --papel: #FFFFFF; --texto: #1E2328; --texto-suave: #5C6870; --linha: #DCE3E7;
    --verde: #2F8F4E; --vermelho: #C0392B;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fundo); color: var(--texto);
    font-family: "IBM Plex Sans", "Segoe UI", Arial, sans-serif; -webkit-font-smoothing: antialiased;
    min-height: 100vh; display: flex; flex-direction: column; }
  header { background: var(--azul); color: #fff; padding: 22px 20px; display: flex; align-items: center; gap: 14px; justify-content: center; }
  header .logo-caixa { background: #fff; border-radius: 8px; padding: 6px 12px; display: inline-flex; align-items: center; }
  header .logo-caixa img { height: 28px; display: block; }

  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
  .cartao { background: var(--papel); border-radius: 14px; border: 1px solid var(--linha);
    padding: 28px 24px; max-width: 380px; width: 100%; box-shadow: 0 2px 10px rgba(20,30,40,0.06); }
  .cartao h1 { font-size: 19px; margin: 0 0 6px; color: var(--azul); }
  .cartao p.ajuda { font-size: 13.5px; color: var(--texto-suave); margin: 0 0 20px; }

  .campo { margin-bottom: 16px; }
  .campo label { display: block; font-size: 11.5px; text-transform: uppercase; color: var(--texto-suave);
    letter-spacing: 0.4px; margin-bottom: 6px; font-weight: 600; }
  input[type=password] {
    width: 100%; padding: 12px 14px; border-radius: 9px; border: 1.5px solid var(--linha);
    font-size: 15px; color: var(--texto);
  }
  input:focus { outline: none; border-color: var(--azul); }

  .botao { width: 100%; padding: 13px; border-radius: 9px; border: none; background: var(--laranja); color: #fff;
    font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 4px; }
  .botao:disabled { background: #C9CFD3; cursor: not-allowed; }
  .botao:not(:disabled):active { background: var(--laranja-escuro); }

  .mensagem { margin-top: 14px; padding: 12px 14px; border-radius: 9px; font-size: 13.5px; font-weight: 600; display: none; }
  .mensagem.sucesso { display: block; background: #E4F3E8; color: var(--verde); }
  .mensagem.erro { display: block; background: #FBE7E4; color: var(--vermelho); }

  .link-login { display: block; text-align: center; margin-top: 16px; color: var(--azul); font-weight: 700;
    font-size: 13.5px; text-decoration: none; }

  .rodape { text-align: center; color: #93A0A8; font-size: 11.5px; padding: 16px; }
</style>
</head>
<body>

<header>
  <div class="logo-caixa"><img src="logo.png" alt="Arco Íris" onerror="this.parentElement.style.display='none'"></div>
</header>

<main>
  <div class="cartao">
    <div id="area-formulario">
      <h1>Definir nova senha</h1>
      <p class="ajuda">Escolha uma senha nova pra acessar o DRAM Web.</p>

      <div class="campo">
        <label>Nova senha</label>
        <input type="password" id="campo-senha-nova" placeholder="Mínimo 6 caracteres">
      </div>
      <div class="campo">
        <label>Confirme a senha nova</label>
        <input type="password" id="campo-senha-confirmar" placeholder="Digite de novo">
      </div>

      <button class="botao" id="botao-salvar">Salvar senha</button>
      <div class="mensagem" id="mensagem"></div>
    </div>

    <div id="area-link-invalido" style="display:none">
      <h1>Link inválido ou expirado</h1>
      <p class="ajuda">Esse link de redefinição de senha não é válido, ou já expirou. Peça pra gerar um novo.</p>
    </div>

    <a class="link-login" href="index.html">&larr; Voltar pro login</a>
  </div>
</main>

<p class="rodape">Powered by DRAM</p>

<script>
const SUPABASE_URL = "https://ictjslaiumgaiphkcxdx.supabase.co";
const SUPABASE_KEY = "sb_publishable_Q0mPbsj_qfJ5UqWvvxk2Ww_y2gfm6xX";

// o link do e-mail de redefinicao vem com os dados no "fragmento" da URL
// (depois do #), tipo: definir-senha.html#access_token=...&type=recovery
function lerParametrosDoFragmento() {
  const fragmento = window.location.hash.replace(/^#/, "");
  return new URLSearchParams(fragmento);
}

const parametros = lerParametrosDoFragmento();
const tokenAcesso = parametros.get("access_token");
const tipoLink = parametros.get("type");

if (!tokenAcesso || tipoLink !== "recovery") {
  document.getElementById("area-formulario").style.display = "none";
  document.getElementById("area-link-invalido").style.display = "block";
}

function atualizarBotaoSalvar() {
  const senha = document.getElementById("campo-senha-nova").value;
  const confirmacao = document.getElementById("campo-senha-confirmar").value;
  document.getElementById("botao-salvar").disabled = !(senha.length >= 6 && senha === confirmacao);
}
document.getElementById("campo-senha-nova").addEventListener("input", atualizarBotaoSalvar);
document.getElementById("campo-senha-confirmar").addEventListener("input", atualizarBotaoSalvar);
atualizarBotaoSalvar();

document.getElementById("botao-salvar").addEventListener("click", async () => {
  const senha = document.getElementById("campo-senha-nova").value;
  const confirmacao = document.getElementById("campo-senha-confirmar").value;
  const mensagem = document.getElementById("mensagem");
  const botao = document.getElementById("botao-salvar");

  if (senha.length < 6) {
    mensagem.className = "mensagem erro";
    mensagem.textContent = "A senha precisa ter pelo menos 6 caracteres.";
    return;
  }
  if (senha !== confirmacao) {
    mensagem.className = "mensagem erro";
    mensagem.textContent = "As senhas digitadas não são iguais.";
    return;
  }

  botao.disabled = true;
  botao.textContent = "Salvando...";
  mensagem.className = "mensagem";

  try {
    const resposta = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
      method: "PUT",
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": `Bearer ${tokenAcesso}`,
        "Content-Type": "application/json",
      },
      body: JSON.stringify({ password: senha }),
    });

    if (!resposta.ok) {
      const corpoErro = await resposta.text();
      throw new Error(corpoErro || `Erro ${resposta.status}`);
    }

    mensagem.className = "mensagem sucesso";
    mensagem.textContent = "Senha salva com sucesso! Redirecionando pro login...";
    setTimeout(() => { window.location.href = "index.html"; }, 2000);
  } catch (erro) {
    mensagem.className = "mensagem erro";
    mensagem.textContent = `Não consegui salvar: ${erro.message}`;
    botao.disabled = false;
    botao.textContent = "Salvar senha";
  }
});
</script>
</body>
</html>
