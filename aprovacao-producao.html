<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DRAM Web - Aprovação de Produção</title>
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#1B4F72">
<script>
  (function verificarLogin() {
    try {
      var sessao = JSON.parse(localStorage.getItem("dram_auth") || "null");
      if (!sessao || sessao.expira_em <= Date.now()) { window.location.href = "index.html"; }
    } catch (erro) { window.location.href = "index.html"; }
  })();
</script>
<style>
  :root {
    --azul: #1B4F72; --laranja: #D9662F; --laranja-escuro: #B84F1F;
    --fundo: #EEF2F4; --papel: #FFFFFF; --texto: #1E2328; --texto-suave: #5C6870;
    --linha: #DCE3E7; --verde: #2F8F4E; --vermelho: #C0392B;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--fundo); color: var(--texto);
    font-family: "IBM Plex Sans", "Segoe UI", Arial, sans-serif; -webkit-font-smoothing: antialiased;
  }
  header { background: var(--azul); color: #fff; padding: 18px 20px 22px; display: flex; align-items: center; gap: 14px; }
  header .logo-caixa { background: #fff; border-radius: 8px; padding: 5px 10px; display: inline-flex; align-items: center; }
  header .logo-caixa img { height: 24px; display: block; }
  header .titulos h1 { font-size: 19px; font-weight: 700; margin: 0; }
  header .titulos p { margin: 2px 0 0; font-size: 12.5px; color: #C9DCEA; }
  main { max-width: 820px; margin: 0 auto; padding: 18px 16px 60px; }

  .cartao { background: var(--papel); border-radius: 12px; border: 1px solid var(--linha); overflow: hidden; overflow-x: auto; }
  table { width: 100%; min-width: 640px; border-collapse: collapse; }
  thead th { text-align: left; font-size: 11px; text-transform: uppercase; color: var(--texto-suave);
    padding: 10px 14px; border-bottom: 1px solid var(--linha); white-space: nowrap; }
  tbody td { padding: 11px 14px; border-bottom: 1px solid var(--linha); font-size: 14px; }
  tbody tr:last-child td { border-bottom: none; }
  .texto-editavel { cursor: pointer; }
  .texto-editavel:hover { text-decoration: underline; color: var(--azul); }
  .botao-excluir { background: none; border: none; color: var(--vermelho); font-size: 18px; cursor: pointer; padding: 0 6px; }

  .barra-final { position: sticky; bottom: 16px; background: var(--papel); border: 1px solid var(--linha);
    padding: 16px; margin-top: 16px; border-radius: 14px; box-shadow: 0 4px 16px rgba(20,30,40,0.10);
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .barra-final .resumo { font-size: 14.5px; font-weight: 700; color: var(--azul); }
  .botao-aprovar { padding: 13px 24px; border-radius: 9px; border: none; background: var(--laranja);
    color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; }
  .botao-aprovar:active { background: var(--laranja-escuro); }
  .botao-aprovar:disabled { background: #C9CFD3; cursor: not-allowed; }

  .mensagem { margin-top: 14px; padding: 13px 15px; border-radius: 9px; font-size: 14px; font-weight: 600; display: none; }
  .mensagem.sucesso { display: block; background: #E4F3E8; color: var(--verde); }
  .mensagem.erro { display: block; background: #FBE7E4; color: var(--vermelho); }

  .vazio, .carregando { padding: 30px 16px; text-align: center; color: var(--texto-suave); font-size: 14px; }
  .rodape { text-align: center; color: #93A0A8; font-size: 11.5px; margin-top: 20px; }
</style>
</head>
<body>

<header>
  <div class="logo-caixa"><img src="logo.png" alt="Arco Íris" onerror="this.parentElement.style.display='none'"></div>
  <div class="titulos"><h1>Aprovação de Produção</h1><p>Confira e corrija antes de aprovar — só depois disso entra no estoque</p></div>
</header>
<script src="menu.js"></script>

<main>
  <div class="cartao">
    <div id="conteudo-tabela" class="carregando">Carregando...</div>
  </div>

  <div class="barra-final" id="barra-final" style="display:none">
    <span class="resumo" id="resumo-pendentes"></span>
    <button class="botao-aprovar" id="botao-aprovar-tudo">Aprovar Tudo</button>
  </div>
  <div class="mensagem" id="mensagem"></div>

  <p class="rodape">Powered by DRAM</p>
</main>

<script>
const SUPABASE_URL = "https://ictjslaiumgaiphkcxdx.supabase.co";
const SUPABASE_KEY = "sb_publishable_Q0mPbsj_qfJ5UqWvvxk2Ww_y2gfm6xX";

async function chamarSupabase(caminho, opcoes = {}) {
  const resposta = await fetch(`${SUPABASE_URL}/rest/v1/${caminho}`, {
    ...opcoes,
    headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}`, "Content-Type": "application/json", ...(opcoes.headers || {}) },
  });
  if (!resposta.ok) throw new Error(await resposta.text() || `Erro ${resposta.status}`);
  const texto = await resposta.text();
  return texto ? JSON.parse(texto) : null;
}

function lerSessaoDram() {
  try {
    const sessao = JSON.parse(localStorage.getItem("dram_auth") || "null");
    return (sessao && sessao.expira_em > Date.now()) ? sessao : null;
  } catch { return null; }
}
const sessaoDram = lerSessaoDram();
const parametros = new URLSearchParams(window.location.search);
const pessoa = (sessaoDram && sessaoDram.email) || parametros.get("pessoa") || "desconhecido";

function formatarDataHora(iso) {
  const data = new Date(iso);
  return data.toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
}
function mostrarMensagem(texto, tipo) {
  const caixa = document.getElementById("mensagem");
  caixa.className = `mensagem ${tipo}`;
  caixa.textContent = texto;
}

let itensCatalogo = [];
let depositos = [];
let pendentes = [];

async function carregar() {
  const alvo = document.getElementById("conteudo-tabela");
  alvo.className = "carregando"; alvo.textContent = "Carregando...";
  document.getElementById("mensagem").className = "mensagem";

  try {
    const [itensResp, depositosResp, pendentesResp] = await Promise.all([
      chamarSupabase("itens?select=id,nome&order=nome"),
      chamarSupabase("depositos?select=id,nome&order=id"),
      chamarSupabase("apontamentos_producao?status=eq.pendente&select=id,item_id,quantidade,deposito_id,pessoa,criado_em&order=criado_em"),
    ]);
    itensCatalogo = itensResp;
    depositos = depositosResp;
    pendentes = pendentesResp;
    desenharTabela();
  } catch (erro) {
    alvo.className = "vazio"; alvo.textContent = `Não consegui carregar: ${erro.message}`;
  }
}

function nomeItem(id) { return itensCatalogo.find(i => i.id === id)?.nome || "—"; }
function nomeDeposito(id) { return depositos.find(d => d.id === id)?.nome || "—"; }

function desenharTabela() {
  const alvo = document.getElementById("conteudo-tabela");
  const barraFinal = document.getElementById("barra-final");

  if (pendentes.length === 0) {
    alvo.className = "vazio"; alvo.textContent = "Nenhum apontamento pendente no momento.";
    barraFinal.style.display = "none";
    return;
  }

  let html = `<table><thead><tr>
    <th>Item</th><th>Quantidade</th><th>Depósito</th><th>Pessoa</th><th>Horário</th><th></th>
  </tr></thead><tbody>`;
  for (const p of pendentes) {
    html += `<tr data-id="${p.id}">
      <td><span class="texto-editavel" data-acao="editar-item">${nomeItem(p.item_id)}</span></td>
      <td><span class="texto-editavel" data-acao="editar-quantidade">${Number(p.quantidade).toLocaleString("pt-BR")} cx</span></td>
      <td><span class="texto-editavel" data-acao="editar-deposito">${nomeDeposito(p.deposito_id)}</span></td>
      <td>${p.pessoa || "—"}</td>
      <td>${formatarDataHora(p.criado_em)}</td>
      <td><button class="botao-excluir" data-acao="excluir" title="Excluir esse apontamento">✕</button></td>
    </tr>`;
  }
  html += "</tbody></table>";
  alvo.className = ""; alvo.innerHTML = html;

  alvo.querySelectorAll('[data-acao="editar-item"]').forEach(el => el.addEventListener("click", (e) => editarItem(linhaId(e))));
  alvo.querySelectorAll('[data-acao="editar-quantidade"]').forEach(el => el.addEventListener("click", (e) => editarQuantidade(linhaId(e))));
  alvo.querySelectorAll('[data-acao="editar-deposito"]').forEach(el => el.addEventListener("click", (e) => editarDeposito(linhaId(e))));
  alvo.querySelectorAll('[data-acao="excluir"]').forEach(el => el.addEventListener("click", (e) => excluirApontamento(linhaId(e))));

  document.getElementById("barra-final").style.display = "flex";
  document.getElementById("resumo-pendentes").textContent =
    `${pendentes.length} apontamento(s) pendente(s)`;
}

function linhaId(evento) {
  return Number(evento.target.closest("tr").dataset.id);
}

async function editarItem(id) {
  const apontamento = pendentes.find(p => p.id === id);
  const nomeAtual = nomeItem(apontamento.item_id);
  const novoNome = window.prompt("Corrigir item (digite o nome EXATO, igual aparece no cadastro):", nomeAtual);
  if (novoNome === null || !novoNome.trim()) return;

  const itemEncontrado = itensCatalogo.find(i => i.nome.toLowerCase() === novoNome.trim().toLowerCase());
  if (!itemEncontrado) {
    mostrarMensagem(`Não encontrei nenhum item chamado exatamente "${novoNome.trim()}". Confira a grafia e tente de novo.`, "erro");
    return;
  }
  await salvarCampo(id, { item_id: itemEncontrado.id });
}

async function editarQuantidade(id) {
  const apontamento = pendentes.find(p => p.id === id);
  const novaQuantidadeTexto = window.prompt("Corrigir quantidade (caixas):", apontamento.quantidade);
  if (novaQuantidadeTexto === null) return;
  const novaQuantidade = parseFloat(novaQuantidadeTexto.replace(",", "."));
  if (!(novaQuantidade > 0)) {
    mostrarMensagem("A quantidade precisa ser um número maior que zero.", "erro");
    return;
  }
  await salvarCampo(id, { quantidade: novaQuantidade });
}

async function editarDeposito(id) {
  const apontamento = pendentes.find(p => p.id === id);
  const nomeAtual = nomeDeposito(apontamento.deposito_id);
  const listaNomes = depositos.map(d => d.nome).join(", ");
  const novoNome = window.prompt(`Corrigir depósito (opções: ${listaNomes}):`, nomeAtual);
  if (novoNome === null || !novoNome.trim()) return;

  const depositoEncontrado = depositos.find(d => d.nome.toLowerCase() === novoNome.trim().toLowerCase());
  if (!depositoEncontrado) {
    mostrarMensagem(`Não encontrei nenhum depósito chamado exatamente "${novoNome.trim()}". Opções: ${listaNomes}.`, "erro");
    return;
  }
  await salvarCampo(id, { deposito_id: depositoEncontrado.id });
}

async function salvarCampo(id, camposAlterados) {
  try {
    await chamarSupabase(`apontamentos_producao?id=eq.${id}`, {
      method: "PATCH", body: JSON.stringify(camposAlterados),
    });
    await carregar();
    mostrarMensagem("Corrigido com sucesso.", "sucesso");
  } catch (erro) {
    mostrarMensagem(`Não consegui corrigir: ${erro.message}`, "erro");
  }
}

async function excluirApontamento(id) {
  const apontamento = pendentes.find(p => p.id === id);
  if (!window.confirm(`Excluir esse apontamento (${nomeItem(apontamento.item_id)}, ${apontamento.quantidade} cx)? Essa ação não pode ser desfeita.`)) return;
  try {
    await chamarSupabase(`apontamentos_producao?id=eq.${id}`, { method: "DELETE" });
    await carregar();
    mostrarMensagem("Apontamento excluído.", "sucesso");
  } catch (erro) {
    mostrarMensagem(`Não consegui excluir: ${erro.message}`, "erro");
  }
}

document.getElementById("botao-aprovar-tudo").addEventListener("click", async () => {
  const botao = document.getElementById("botao-aprovar-tudo");
  const quantidadeAntes = pendentes.length;
  if (!window.confirm(`Aprovar todos os ${quantidadeAntes} apontamento(s) pendente(s)? Isso já entra no estoque, e não tem como desfazer por aqui.`)) return;

  botao.disabled = true;
  botao.textContent = "Aprovando...";
  try {
    const resultado = await chamarSupabase("rpc/aprovar_apontamentos_producao", {
      method: "POST", body: JSON.stringify({ p_aprovador: pessoa }),
    });
    mostrarMensagem(`${resultado} apontamento(s) aprovado(s) — já entraram no estoque.`, "sucesso");
    await carregar();
  } catch (erro) {
    mostrarMensagem(`Não consegui aprovar: ${erro.message}`, "erro");
  } finally {
    botao.disabled = false;
    botao.textContent = "Aprovar Tudo";
  }
});

carregar();
</script>
</body>
</html>
