<script>
const SUPABASE_URL = "https://ictjslaiumgaiphkcxdx.supabase.co";
const SUPABASE_KEY = "sb_publishable_Q0mPbsj_qfJ5UqWvvxk2Ww_y2gfm6xX";
const FOCUS_BASE_URL = "https://api.focusnfe.com.br"; // produção (estava apontando pra homologação por engano)
const FUNCTIONS_URL = `${SUPABASE_URL}/functions/v1`;

function obterSessao() {
  try {
    return JSON.parse(localStorage.getItem("dram_auth") || "null");
  } catch {
    return null;
  }
}

// chamada a uma Edge Function, agora com limite de tempo (a pagina nao fica
// pendurada se o servidor nao responder) e tolerante a resposta que nao e'
// JSON (pagina de erro 502/504 etc) ou a sessao expirada (401) - nesses
// casos devolve ok=false com uma mensagem legivel em dados.erro.
async function chamarFunction(nome, corpo, timeoutMs = 60000) {
  const sessao = obterSessao();
  const controlador = new AbortController();
  const timer = setTimeout(() => controlador.abort(), timeoutMs);
  try {
    const resposta = await fetch(`${FUNCTIONS_URL}/${nome}`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${sessao ? sessao.access_token : SUPABASE_KEY}`,
        "apikey": SUPABASE_KEY,
      },
      body: JSON.stringify(corpo),
      signal: controlador.signal,
    });
    let dados;
    try {
      dados = await resposta.json();
    } catch {
      dados = { erro: `Resposta inesperada do servidor (HTTP ${resposta.status}).` };
    }
    if (resposta.status === 401) {
      dados.erro = "Sessão expirada. Saia do DRAM e entre de novo.";
    } else if (!resposta.ok && !dados.erro && dados.message) {
      dados.erro = dados.message;
    }
    return { ok: resposta.ok, dados };
  } catch (erro) {
    if (erro && erro.name === "AbortError") {
      throw new Error(`Tempo esgotado (${timeoutMs / 1000}s) esperando a resposta de ${nome}.`);
    }
    throw erro;
  } finally {
    clearTimeout(timer);
  }
}

function escaparHtml(texto) {
  return String(texto == null ? "" : texto)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

// "agora", "7 min", "2h" - ha' quanto tempo a nota foi registrada
function tempoDecorrido(iso) {
  if (!iso) return "";
  const minutos = Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 60000));
  if (minutos < 1) return "agora";
  if (minutos < 60) return `${minutos} min`;
  return `${Math.floor(minutos / 60)}h${String(minutos % 60).padStart(2, "0")}`;
}

// gera o boleto de cada parcela do pedido que ainda nao tenha um boleto
// registrado - usado depois que a nota autoriza (na hora, ou tarde, via
// "Verificar status"), pra fechar o ciclo sozinho sem precisar rodar nada
// na mao no painel do Supabase. So' mexe em pedido com forma_pagamento
// boleto - resto (pix, deposito, sem forma) nao tem boleto pra gerar.
async function gerarBoletosSeNecessario(pedidoId) {
  const pedido = pedidos.find(p => p.id === pedidoId);
  if (!pedido || pedido.forma_pagamento !== "boleto") return null;

  const parcelas = await chamarSupabase(`pedido_parcelas?pedido_id=eq.${pedidoId}&select=id,numero_parcela`);
  if (parcelas.length === 0) return null;

  const boletosExistentes = await chamarSupabase(
    `boletos?pedido_id=eq.${pedidoId}&status=eq.registrado&select=pedido_parcela_id`
  );
  const parcelasComBoleto = new Set(boletosExistentes.map(b => b.pedido_parcela_id));
  const parcelasFaltando = parcelas.filter(p => !parcelasComBoleto.has(p.id));
  if (parcelasFaltando.length === 0) return null;

  const resultados = [];
  for (const parcela of parcelasFaltando) {
    try {
      const { ok } = await chamarFunction("emitir-boleto", { pedido_parcela_id: parcela.id });
      resultados.push({ numero_parcela: parcela.numero_parcela, ok });
    } catch {
      resultados.push({ numero_parcela: parcela.numero_parcela, ok: false });
    }
  }
  return resultados;
}

// consulta de novo o status da nota na Focus/SEFAZ (NUNCA reemite - so'
// chama consultar-nota-fiscal, que so' consulta e grava o que encontrar).
// Usada pra nota "processando", "enviando" ou com falha de envio.
async function verificarStatusNotaDoPedido(pedidoId, botao) {
  botao.disabled = true;
  botao.textContent = "Verificando...";
  try {
    const { ok, dados } = await chamarFunction("consultar-nota-fiscal", { pedido_id: pedidoId });
    if (!ok && dados.erro) {
      alert(`Não consegui verificar: ${dados.erro}`);
    } else if (ok && dados.nao_encontrada && dados.mensagem) {
      // a Focus nao conhece a nota: ou o envio e' recente (aguarde), ou foi
      // marcada como "nao_enviada" (ai' o botao vira "Emitir NF-e")
      alert(dados.mensagem);
    }
    // se a nota acabou de autorizar agora, aproveita e ja' gera o(s)
    // boleto(s) pendente(s) desse pedido - fecha o ciclo sem precisar
    // clicar em mais nada depois
    if (ok && dados.focus && dados.focus.status === "autorizado") {
      botao.textContent = "Gerando boleto...";
      await gerarBoletosSeNecessario(pedidoId);
    }
    // recarrega a lista inteira, mais simples e seguro que tentar
    // remontar so' aquela linha - reflete o status mais atual de tudo
    await carregarPedidos();
  } catch (erro) {
    alert(`Erro: ${erro.message}`);
    botao.disabled = false;
    botao.textContent = "Verificar status";
  }
}

// espera a SEFAZ autorizar (consulta algumas vezes, de poucos em poucos
// segundos) - devolve o retorno da Focus quando sai de "processando", ou
// null se continuar processando depois das tentativas
async function aguardarStatusNota(pedidoId, tentativas = 6, intervaloMs = 2500) {
  for (let i = 0; i < tentativas; i++) {
    await new Promise((resolver) => setTimeout(resolver, intervaloMs));
    try {
      const { ok, dados } = await chamarFunction("consultar-nota-fiscal", { pedido_id: pedidoId }, 40000);
      if (ok && dados.focus && dados.focus.status && dados.focus.status !== "processando_autorizacao") {
        return dados.focus;
      }
    } catch {
      // uma consulta que falha no meio do caminho so' tenta de novo na proxima volta
    }
  }
  return null;
}

// emite (ou reemite) a NF-e de um pedido direto da tela de Pedidos - cobre
// o pedido que ficou SEM nota (nunca enviada), com falha de envio ja'
// confirmada como "nao_enviada", ou rejeitada pela SEFAZ.
// SEGURANCA contra nota duplicada (NF-e e' documento real): se ja' existe
// alguma nota registrada pra esse pedido, CONFERE NA FOCUS antes - se a
// Focus ja' tem a nota (autorizada ou processando), nao emite outra, so'
// atualiza a tela. Alem disso a propria funcao emitir-nota-fiscal recusa
// emissao quando ha' nota autorizada/processando/enviando/erro_envio.
async function emitirNotaDoPedido(pedidoId, botao) {
  if (!confirm(`Emitir a NF-e do pedido nº ${pedidoId} agora? É uma nota fiscal real.`)) return;
  const rotuloOriginal = botao.textContent;
  botao.disabled = true;
  try {
    if (notaMaisRecentePorPedido.get(pedidoId)) {
      botao.textContent = "Conferindo na Focus...";
      const consulta = await chamarFunction("consultar-nota-fiscal", { pedido_id: pedidoId });
      const statusNaFocus = consulta.dados && consulta.dados.focus && consulta.dados.focus.status;
      if (consulta.ok && statusNaFocus && statusNaFocus !== "erro_autorizacao") {
        // a Focus ja' tem essa nota: NAO emite outra
        if (statusNaFocus === "autorizado") await gerarBoletosSeNecessario(pedidoId);
        alert(`Esse pedido já tem uma nota na Focus (status: ${statusNaFocus}). Atualizei a tela e não emiti outra.`);
        await carregarPedidos();
        return;
      }
      if (consulta.ok && consulta.dados.aguarde) {
        alert(consulta.dados.mensagem);
        botao.disabled = false;
        botao.textContent = rotuloOriginal;
        return;
      }
      if (!consulta.ok) {
        alert(`Não consegui conferir a nota na Focus (${consulta.dados.erro || "erro desconhecido"}). Por segurança não emiti outra. Tente de novo em instantes.`);
        botao.disabled = false;
        botao.textContent = rotuloOriginal;
        return;
      }
    }

    botao.textContent = "Emitindo...";
    const { ok, dados } = await chamarFunction("emitir-nota-fiscal", { pedido_id: pedidoId });
    let focusFinal = dados.focus;
    if (ok && focusFinal && focusFinal.status === "processando_autorizacao") {
      botao.textContent = "Aguardando SEFAZ...";
      const resultadoEspera = await aguardarStatusNota(pedidoId);
      if (resultadoEspera) focusFinal = resultadoEspera;
    }

    if (focusFinal && focusFinal.status === "autorizado") {
      botao.textContent = "Gerando boleto...";
      await gerarBoletosSeNecessario(pedidoId);
    } else if (!ok) {
      alert(`Não consegui emitir: ${dados.erro || (focusFinal && focusFinal.mensagem_sefaz) || "erro desconhecido"}`);
    } else if (focusFinal && focusFinal.status === "processando_autorizacao") {
      alert("A nota foi enviada e a SEFAZ ainda está processando. A tela confere sozinha a cada minuto e gera o boleto quando autorizar.");
    }
    await carregarPedidos();
  } catch (erro) {
    alert(`Erro: ${erro.message}\n\nA nota pode ter sido enviada mesmo assim. Use "Verificar status" antes de tentar emitir de novo.`);
    await carregarPedidos();
  }
}

async function cancelarNotaDoPedido(pedidoId, botao) {
  const justificativa = window.prompt(
    "Motivo do cancelamento (mínimo 15 caracteres). Isso vai cancelar a nota E devolver o estoque:"
  );
  if (!justificativa) return;
  if (justificativa.length < 15) {
    alert("A justificativa precisa ter pelo menos 15 caracteres.");
    return;
  }
  if (!confirm(`Confirma o cancelamento do pedido nº ${pedidoId}? Essa ação não pode ser desfeita.`)) return;

  botao.disabled = true;
  botao.textContent = "Cancelando...";
  try {
    const { ok, dados } = await chamarFunction("cancelar-pedido", { pedido_id: pedidoId, justificativa });
    if (ok) {
      alert("Pedido cancelado com sucesso. O estoque foi devolvido.");
      carregarPedidos();
    } else {
      alert(`Não consegui cancelar: ${dados.erro || JSON.stringify(dados)}`);
      botao.disabled = false;
      botao.textContent = "Cancelar";
    }
  } catch (erro) {
    alert(`Erro: ${erro.message}`);
    botao.disabled = false;
    botao.textContent = "Cancelar";
  }
}

async function chamarSupabase(caminho) {
  const resposta = await fetch(`${SUPABASE_URL}/rest/v1/${caminho}`, {
    headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` },
  });
  if (!resposta.ok) throw new Error(`Erro ${resposta.status}`);
  return resposta.json();
}

// o Supabase devolve no maximo 1000 linhas por consulta - sem paginar, o
// historico maior que isso era cortado em silencio (pedidos/notas/boletos
// antigos sumiam ou apareciam como "Pendente" sem ser). Esta busca em
// paginas de 1000 ate' acabar. "caminho" ja' deve ter "?" e um "order".
async function chamarSupabasePaginado(caminho) {
  const tamanho = 1000;
  let todos = [];
  for (let deslocamento = 0; ; deslocamento += tamanho) {
    const pagina = await chamarSupabase(`${caminho}&limit=${tamanho}&offset=${deslocamento}`);
    todos = todos.concat(pagina);
    if (pagina.length < tamanho) break;
  }
  return todos;
}

// busca por lista de ids em grupos (evita URL gigante)
async function buscarPorIds(tabela, selecao, ids, tamanho = 150) {
  let todos = [];
  for (let i = 0; i < ids.length; i += tamanho) {
    const grupo = ids.slice(i, i + tamanho);
    todos = todos.concat(await chamarSupabase(`${tabela}?select=${selecao}&id=in.(${grupo.join(",")})`));
  }
  return todos;
}

function formatarMoeda(valor) {
  return Number(valor).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
}

function dataBrParaIso(texto) {
  const partes = texto.trim().split("/");
  if (partes.length !== 3) return null;
  const [d, m, a] = partes;
  if (!d || !m || !a) return null;
  return `${a.padStart(4, "0")}-${m.padStart(2, "0")}-${d.padStart(2, "0")}`;
}

function formatarDataISO(data) {
  const ano = data.getFullYear();
  const mes = String(data.getMonth() + 1).padStart(2, "0");
  const dia = String(data.getDate()).padStart(2, "0");
  return `${ano}-${mes}-${dia}`;
}

function formatarDataBr(data) {
  const dia = String(data.getDate()).padStart(2, "0");
  const mes = String(data.getMonth() + 1).padStart(2, "0");
  const ano = data.getFullYear();
  return `${dia}/${mes}/${ano}`;
}

let pedidos = [];
let notaMaisRecentePorPedido = new Map();
let boletosPorPedido = new Map();

// extrai um texto de erro legivel da resposta da Focus/SEFAZ guardada -
// os dois formatos mais comuns sao {mensagem_sefaz} (rejeicao da SEFAZ,
// vinda do consultar-nota-fiscal) e {mensagem} (erro de validacao antes
// de chegar na SEFAZ, tipo XML mal formado)
function extrairMotivoErroNota(respostaBruta) {
  if (!respostaBruta) return "erro desconhecido";
  return respostaBruta.mensagem_sefaz || respostaBruta.mensagem || "erro desconhecido";
}

// --- período: por padrão, so' busca o mes atual no banco (nao o
// historico inteiro) - evita a pagina ficar cada vez mais pesada com o
// tempo. Os botoes rapidos (Este mes / Mes passado / Ver tudo) so' mexem
// nos campos De/Ate e recarregam do servidor; os campos De/Ate tambem
// podem ser digitados na mao pra qualquer periodo especifico.
function aplicarPeriodoRapido(periodo) {
  const hoje = new Date();
  let dataDe = null;
  let dataAte = null;

  if (periodo === "mes-atual") {
    dataDe = new Date(hoje.getFullYear(), hoje.getMonth(), 1);
    dataAte = new Date(hoje.getFullYear(), hoje.getMonth() + 1, 0);
  } else if (periodo === "mes-passado") {
    dataDe = new Date(hoje.getFullYear(), hoje.getMonth() - 1, 1);
    dataAte = new Date(hoje.getFullYear(), hoje.getMonth(), 0);
  }
  // "tudo" -> dataDe/dataAte ficam null (sem filtro de data nenhum)

  document.getElementById("filtro-data-de").value = dataDe ? formatarDataBr(dataDe) : "";
  document.getElementById("filtro-data-ate").value = dataAte ? formatarDataBr(dataAte) : "";
  marcarBotaoPeriodoAtivo(periodo);
  carregarPedidos();
}

function marcarBotaoPeriodoAtivo(periodo) {
  document.querySelectorAll(".botao-periodo").forEach(botao => {
    botao.classList.toggle("ativo", botao.dataset.periodo === periodo);
  });
}

// quando o usuario digita uma data manualmente (em vez de clicar num dos
// botoes rapidos), nenhum botao rapido corresponde mais exatamente a
// esse periodo - tira o destaque de todos, pra nao mostrar "Este mês"
// marcado enquanto o filtro real e' outra coisa
function desmarcarBotoesPeriodo() {
  document.querySelectorAll(".botao-periodo").forEach(botao => botao.classList.remove("ativo"));
}

// silencioso=true: recarrega por baixo dos panos (sem apagar a tabela nem
// mostrar "Carregando") - usado pela verificacao automatica das notas
async function carregarPedidos(silencioso = false) {
  const corpo = document.getElementById("corpo-tabela");
  const mensagem = document.getElementById("area-mensagem");
  if (!silencioso) {
    mensagem.innerHTML = `<div class="carregando">Carregando pedidos...</div>`;
    corpo.innerHTML = "";
  }
  try {
    const dataDeIso = dataBrParaIso(document.getElementById("filtro-data-de").value);
    const dataAteIso = dataBrParaIso(document.getElementById("filtro-data-ate").value);

    // filtro de data já vai direto na consulta ao banco (nao busca tudo
    // pra depois filtrar na tela) - assim a pagina so' carrega o volume
    // do periodo escolhido, nao o historico inteiro
    let filtroData = "";
    if (dataDeIso) {
      filtroData += `&criado_em=gte.${dataDeIso}`;
    }
    if (dataAteIso) {
      // soma 1 dia ao "ate' " e usa "menor que", pra incluir o dia inteiro
      // (a coluna tem hora tambem, nao so' a data)
      const proximoDia = new Date(dataAteIso + "T00:00:00");
      proximoDia.setDate(proximoDia.getDate() + 1);
      filtroData += `&criado_em=lt.${formatarDataISO(proximoDia)}`;
    }

    const novosPedidos = await chamarSupabasePaginado(
      `pedidos?select=id,total,criado_em,pessoa,status,com_nota_fiscal,forma_pagamento,clientes(nome)${filtroData}&order=criado_em.desc,id.desc`
    );

    // notas e boletos so' do periodo carregado: toda nota/boleto nasce
    // DEPOIS do pedido, entao basta pegar o que foi criado a partir do
    // pedido mais antigo da lista (ordenada do mais novo pro mais antigo)
    const menorData = novosPedidos.length > 0 ? novosPedidos[novosPedidos.length - 1].criado_em : null;
    const filtroPosterior = menorData ? `&criado_em=gte.${encodeURIComponent(menorData)}` : "";

    // busca TODAS as notas do periodo (nao so' autorizado/cancelado) -
    // precisamos da mais recente de cada pedido pra saber se ainda esta'
    // processando, se deu erro (e qual), ou se realmente nunca foi tentada
    const notas = menorData
      ? await chamarSupabasePaginado(
          `notas_fiscais?select=id,pedido_id,status,resposta_bruta,criado_em&pedido_id=not.is.null${filtroPosterior}&order=criado_em.desc,id.desc`
        )
      : [];
    const novoMapaNotas = new Map();
    for (const n of notas) {
      if (!novoMapaNotas.has(n.pedido_id)) novoMapaNotas.set(n.pedido_id, n);
    }

    const boletosBrutos = menorData
      ? await chamarSupabasePaginado(
          `boletos?select=id,pedido_id,pedido_parcela_id,url_boleto,url_pdf,status&status=eq.registrado${filtroPosterior}&order=criado_em,id`
        )
      : [];
    const idsParcelas = [...new Set(boletosBrutos.map(b => b.pedido_parcela_id).filter(Boolean))];
    const parcelas = await buscarPorIds("pedido_parcelas", "id,numero_parcela", idsParcelas);
    const numeroParcelaPorId = new Map(parcelas.map(p => [p.id, p.numero_parcela]));
    const novoMapaBoletos = new Map();
    for (const b of boletosBrutos) {
      if (!novoMapaBoletos.has(b.pedido_id)) novoMapaBoletos.set(b.pedido_id, []);
      novoMapaBoletos.get(b.pedido_id).push({ ...b, numero_parcela: numeroParcelaPorId.get(b.pedido_parcela_id) });
    }

    // so' troca o estado da tela depois que TUDO foi buscado com sucesso
    pedidos = novosPedidos;
    notaMaisRecentePorPedido = novoMapaNotas;
    boletosPorPedido = novoMapaBoletos;

    mensagem.innerHTML = "";
    desenharTabela();
    // a cada carregamento "de verdade" (nao silencioso), logo depois confere
    // sozinho as notas que ainda estao em andamento
    if (!silencioso) setTimeout(verificarPendentesAutomaticamente, 1500);
  } catch (erro) {
    if (silencioso) {
      console.warn("Recarga silenciosa falhou:", erro);
    } else {
      mensagem.innerHTML = `<div class="erro">Não consegui carregar os pedidos: ${erro.message}</div>`;
    }
  }
}

// --- verificacao automatica: toda nota que ainda esta "em andamento"
// (processando_autorizacao, enviando, erro_envio) e' consultada na Focus
// sozinha, ao abrir a tela e a cada 1 minuto enquanto ela estiver aberta.
// Se autorizou, ja' gera o(s) boleto(s). NUNCA reemite - so' consulta. Assim
// a nota nao fica "Pendente" so' porque ninguem clicou em "Verificar status".
const STATUS_AUTO_VERIFICAR = new Set(["processando_autorizacao", "enviando", "erro_envio"]);
let verificandoAutomatico = false;

async function verificarPendentesAutomaticamente() {
  if (verificandoAutomatico) return;
  verificandoAutomatico = true;
  let algumaMudanca = false;
  try {
    const alvos = pedidos
      .filter(p => p.com_nota_fiscal && p.status !== "cancelado")
      .filter(p => {
        const nota = notaMaisRecentePorPedido.get(p.id);
        return nota && STATUS_AUTO_VERIFICAR.has(nota.status);
      })
      .slice(0, 15); // no maximo 15 consultas por rodada
    for (const p of alvos) {
      const statusAntes = notaMaisRecentePorPedido.get(p.id).status;
      try {
        const { ok, dados } = await chamarFunction("consultar-nota-fiscal", { pedido_id: p.id }, 40000);
        if (!ok) continue;
        const statusNaFocus = dados.focus && dados.focus.status;
        if (statusNaFocus === "autorizado") {
          await gerarBoletosSeNecessario(p.id);
          algumaMudanca = true;
        } else if ((statusNaFocus || dados.nota_status) && (statusNaFocus || dados.nota_status) !== statusAntes) {
          algumaMudanca = true;
        }
      } catch {
        // falhou nessa nota: tenta de novo na proxima rodada
      }
    }
    if (algumaMudanca) await carregarPedidos(true);
  } finally {
    verificandoAutomatico = false;
  }
}

function desenharTabela() {
  const corpo = document.getElementById("corpo-tabela");
  const mensagem = document.getElementById("area-mensagem");

  const filtroCliente = document.getElementById("filtro-cliente").value.trim().toLowerCase();
  const filtroNumero = document.getElementById("filtro-numero").value.trim();

  // o filtro de data ja' foi aplicado direto na consulta ao banco (ver
  // carregarPedidos) - aqui so' sobra filtrar cliente/numero em cima do
  // que ja' foi carregado pro periodo atual
  const filtrados = pedidos.filter(p => {
    if (filtroCliente && !p.clientes.nome.toLowerCase().includes(filtroCliente)) return false;
    if (filtroNumero && String(p.id) !== filtroNumero) return false;
    return true;
  });

  if (filtrados.length === 0) {
    corpo.innerHTML = "";
    mensagem.innerHTML = `<div class="vazio">Nenhum pedido encontrado.</div>`;
    return;
  }
  mensagem.innerHTML = "";

  corpo.innerHTML = filtrados.map(p => {
    const data = new Date(p.criado_em);
    const dataTexto = data.toLocaleDateString("pt-BR") + " " + data.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });

    const statusCancelado = p.status === "cancelado";
    const statusTexto = statusCancelado ? "Cancelado" : "Faturado";
    const statusClasse = statusCancelado ? "cancelado" : "faturado";

    let notaTexto = "—";
    let botoesNota = "";
    const botaoEmitir = (rotulo) =>
      `<button type="button" class="botao-nf destaque" data-pedido="${p.id}" data-acao="emitir-nf">${rotulo}</button>`;
    const botaoVerificar =
      `<button type="button" class="botao-nf" data-pedido="${p.id}" data-acao="verificar-status">Verificar status</button>`;
    if (p.com_nota_fiscal) {
      if (statusCancelado) {
        notaTexto = "Cancelada";
      } else {
        const nota = notaMaisRecentePorPedido.get(p.id);
        if (nota && nota.status === "autorizado") {
          notaTexto = `Nº ${(nota.resposta_bruta && nota.resposta_bruta.numero) || "—"}`;
          const caminhoDanfe = nota.resposta_bruta && nota.resposta_bruta.caminho_danfe;
          if (caminhoDanfe) {
            botoesNota += `<a class="botao-nf" href="${FOCUS_BASE_URL}${caminhoDanfe}" target="_blank" rel="noopener">Ver NF</a>`;
          }
          const caminhoXml = nota.resposta_bruta && nota.resposta_bruta.caminho_xml_nota_fiscal;
          if (caminhoXml) {
            botoesNota += `<a class="botao-nf" href="${FOCUS_BASE_URL}${caminhoXml}" target="_blank" rel="noopener" download>XML</a>`;
          }
          botoesNota += `<button type="button" class="botao-nf perigo" data-pedido="${p.id}" data-acao="cancelar-nf">Cancelar</button>`;
        } else if (nota && nota.status === "cancelado") {
          notaTexto = "Cancelada";
        } else if (!nota) {
          // com_nota_fiscal marcado mas NENHUM registro: a emissao nunca
          // saiu (aba fechada, falha de rede...) - agora tem botao pra emitir
          notaTexto = "Pendente — NF-e não emitida";
          botoesNota += botaoEmitir("Emitir NF-e");
        } else if (nota.status === "erro" || nota.status === "erro_autorizacao") {
          // rejeitada (SEFAZ) ou recusada na validacao: mostra o motivo.
          // "Reemitir" confere na Focus antes, entao nunca duplica.
          notaTexto = `Pendente — ${escaparHtml(extrairMotivoErroNota(nota.resposta_bruta))}`;
          botoesNota += botaoEmitir("Reemitir");
        } else if (nota.status === "nao_enviada") {
          // a Focus confirmou que nao conhece essa nota: emitir e' seguro
          notaTexto = "Pendente — não chegou à SEFAZ";
          botoesNota += botaoEmitir("Emitir NF-e");
        } else if (nota.status === "erro_envio") {
          notaTexto = `Pendente — falha ao enviar (${tempoDecorrido(nota.criado_em)})`;
          botoesNota += botaoVerificar;
        } else if (nota.status === "enviando") {
          notaTexto = `Pendente — enviando (${tempoDecorrido(nota.criado_em)})`;
          botoesNota += botaoVerificar;
        } else {
          // processando_autorizacao (ou qualquer outro status em andamento)
          notaTexto = `Pendente — processando (${tempoDecorrido(nota.criado_em)})`;
          botoesNota += botaoVerificar;
        }
      }
    }

    const boletosDoPedido = boletosPorPedido.get(p.id) || [];
    const botoesBoleto = boletosDoPedido.length === 0
      ? "—"
      : boletosDoPedido.map(b =>
          `<a class="botao-nf" href="${b.url_pdf || b.url_boleto}" target="_blank" rel="noopener">${boletosDoPedido.length > 1 ? `Parcela ${b.numero_parcela || "?"}` : "Ver Boleto"}</a>`
        ).join("");

    return `<tr data-id="${p.id}">
      <td class="numero-pedido">Nº ${p.id}</td>
      <td style="max-width:170px">${p.clientes.nome}</td>
      <td>${dataTexto}</td>
      <td class="pessoa">${p.pessoa || "—"}</td>
      <td><span class="selo-status ${statusClasse}">${statusTexto}</span></td>
      <td>${notaTexto}<div class="botoes-nf-linha">${botoesNota}</div></td>
      <td><div class="botoes-nf-linha">${botoesBoleto}</div></td>
      <td class="num">${formatarMoeda(p.total)}</td>
    </tr>`;
  }).join("");

  corpo.querySelectorAll("tr[data-id]").forEach(linha => {
    linha.addEventListener("click", (evento) => {
      if (evento.target.closest(".botao-nf")) return; // nao abre o recibo quando clica nos botoes de nota
      window.open(`recibo-pedido.html?pedido=${linha.dataset.id}`, "_blank");
    });
  });
  corpo.querySelectorAll('[data-acao="cancelar-nf"]').forEach(botao => {
    botao.addEventListener("click", (evento) => {
      evento.stopPropagation();
      cancelarNotaDoPedido(Number(botao.dataset.pedido), botao);
    });
  });
  corpo.querySelectorAll('[data-acao="verificar-status"]').forEach(botao => {
    botao.addEventListener("click", (evento) => {
      evento.stopPropagation();
      verificarStatusNotaDoPedido(Number(botao.dataset.pedido), botao);
    });
  });
  corpo.querySelectorAll('[data-acao="emitir-nf"]').forEach(botao => {
    botao.addEventListener("click", (evento) => {
      evento.stopPropagation();
      emitirNotaDoPedido(Number(botao.dataset.pedido), botao);
    });
  });
}

document.querySelectorAll(".botao-periodo").forEach(botao => {
  botao.addEventListener("click", () => aplicarPeriodoRapido(botao.dataset.periodo));
});

// cliente/numero filtram na hora, so' na tela (sem recarregar do banco) -
// a data, se digitada na mao, recarrega do banco so' quando o campo perde
// o foco ou aperta Enter (evita ficar buscando a cada letra digitada)
document.getElementById("filtro-cliente").addEventListener("input", desenharTabela);
document.getElementById("filtro-numero").addEventListener("input", desenharTabela);
document.getElementById("filtro-data-de").addEventListener("change", () => { desmarcarBotoesPeriodo(); carregarPedidos(); });
document.getElementById("filtro-data-ate").addEventListener("change", () => { desmarcarBotoesPeriodo(); carregarPedidos(); });

document.getElementById("botao-limpar").addEventListener("click", () => {
  document.getElementById("filtro-cliente").value = "";
  document.getElementById("filtro-numero").value = "";
  aplicarPeriodoRapido("mes-atual"); // "limpar" volta pro padrao (mes atual), nao pro historico inteiro
});

aplicarPeriodoRapido("mes-atual"); // ao abrir a pagina, ja' comeca so' com o mes atual

// enquanto a aba estiver visivel, confere as notas em andamento a cada 1 minuto
setInterval(() => {
  if (!document.hidden) verificarPendentesAutomaticamente();
}, 60000);
</script>
