<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DRAM Web - Pedidos</title>
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#1B4F72">
<script>
  // cadeado: exige login antes de mostrar a pagina. Sem sessao valida
  // (ou expirada), manda direto pra tela de login, antes de qualquer
  // conteudo aparecer.
  (function verificarLogin() {
    try {
      var sessao = JSON.parse(localStorage.getItem("dram_auth") || "null");
      if (!sessao || sessao.expira_em <= Date.now()) {
        window.location.href = "index.html";
      }
    } catch (erro) {
      window.location.href = "index.html";
    }
  })();
</script>
<style>
  :root {
    --azul: #1B4F72; --laranja: #D9662F;
    --fundo: #EEF2F4; --papel: #FFFFFF; --texto: #1E2328; --texto-suave: #5C6870; --linha: #DCE3E7;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fundo); color: var(--texto);
    font-family: "IBM Plex Sans", "Segoe UI", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  header { background: var(--azul); color: #fff; padding: 18px 20px 22px; display: flex; align-items: center; gap: 14px; }
  header .logo-caixa { background: #fff; border-radius: 8px; padding: 5px 10px; display: inline-flex; align-items: center; }
  header .logo-caixa img { height: 24px; display: block; }
  header .titulos h1 { font-size: 19px; font-weight: 700; margin: 0; }
  header .titulos p { margin: 2px 0 0; font-size: 12.5px; color: #C9DCEA; }

  main { max-width: 1180px; margin: 0 auto; padding: 18px 16px 60px; }

  .cartao-filtros { background: var(--papel); border-radius: 12px; border: 1px solid var(--linha); padding: 16px; margin-bottom: 14px; }
  .linha-filtros { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
  .campo-filtro { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 130px; }
  .campo-filtro label { font-size: 11px; text-transform: uppercase; color: var(--texto-suave); letter-spacing: 0.4px; }
  .campo-filtro input { padding: 10px 12px; border-radius: 9px; border: 1.5px solid var(--linha); font-size: 14px; color: var(--texto); }
  .campo-filtro input:focus { outline: none; border-color: var(--azul); }
  .botao { padding: 10px 16px; border-radius: 9px; border: none; background: var(--azul); color: #fff; font-size: 13.5px; font-weight: 700; cursor: pointer; white-space: nowrap; }

  .cartao-secao { background: var(--papel); border-radius: 12px; border: 1px solid var(--linha); overflow: hidden; overflow-x: auto; }
  table { width: 100%; min-width: 920px; border-collapse: collapse; }
  thead th { text-align: left; font-size: 11px; text-transform: uppercase; color: var(--texto-suave); padding: 10px 14px; border-bottom: 1px solid var(--linha); white-space: nowrap; }
  thead th.num { text-align: right; }
  tbody td { padding: 12px 14px; border-bottom: 1px solid var(--linha); font-size: 14px; }
  tbody td.num { text-align: right; font-variant-numeric: tabular-nums; }
  tbody td.pessoa { color: var(--texto-suave); font-size: 13px; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: #F6F9FA; }
  .numero-pedido { font-weight: 700; color: var(--azul); }
  .selo-status { display: inline-block; padding: 3px 10px; border-radius: 100px; font-size: 12px; font-weight: 700; }
  .selo-status.faturado { background: #E4F3E8; color: #2F8F4E; }
  .selo-status.cancelado { background: #FBE7E4; color: #C0392B; }
  .botoes-nf-linha { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; max-width: 160px; }
  .botao-nf {
    padding: 4px 10px; border-radius: 7px; border: 1.5px solid var(--linha); background: #fff;
    font-size: 11.5px; font-weight: 700; cursor: pointer; color: var(--azul); text-decoration: none; white-space: nowrap;
  }
  .botao-nf.perigo { border-color: #E5B4AC; color: #C0392B; }
  .botao-nf:disabled { opacity: 0.5; cursor: not-allowed; }

  .vazio, .carregando, .erro { padding: 30px 16px; text-align: center; color: var(--texto-suave); font-size: 14px; }
  .erro { color: #C0392B; }
  .rodape { text-align: center; color: #93A0A8; font-size: 11.5px; margin-top: 20px; }

  nav.nav-dram {
    background: #123551;
    display: flex;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    padding: 0 12px;
  }
  nav.nav-dram a {
    color: #C9DCEA;
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    padding: 12px 14px;
    white-space: nowrap;
    border-bottom: 3px solid transparent;
  }
  nav.nav-dram a.ativa {
    color: #fff;
    border-bottom-color: #D9662F;
  }
</style>
</head>
<body>

<header>
  <div class="logo-caixa"><img src="logo.png" alt="Arco Íris" onerror="this.parentElement.style.display='none'"></div>
  <div class="titulos">
    <h1>Pedidos</h1>
    <p>Histórico de pedidos lançados</p>
  </div>
</header>
<nav class="nav-dram">
  <a href="estoque.html">Estoque</a>
  <a href="ajustar-estoque.html">Ajustar Estoque</a>
  <a href="tabelas-preco.html">Tabelas de Preço</a>
  <a href="clientes.html">Clientes</a>
  <a href="novo-pedido.html">Novo Pedido</a>
  <a href="pedidos.html">Pedidos</a>
  <a href="operacoes-especiais.html">Operações Especiais</a>
</nav>



<main>
  <div class="cartao-filtros">
    <div class="linha-filtros">
      <div class="campo-filtro">
        <label>Cliente</label>
        <input type="text" id="filtro-cliente" placeholder="Buscar cliente...">
      </div>
      <div class="campo-filtro">
        <label>Nº do pedido</label>
        <input type="text" id="filtro-numero" placeholder="Ex: 47">
      </div>
      <div class="campo-filtro">
        <label>De</label>
        <input type="text" id="filtro-data-de" placeholder="DD/MM/AAAA">
      </div>
      <div class="campo-filtro">
        <label>Até</label>
        <input type="text" id="filtro-data-ate" placeholder="DD/MM/AAAA">
      </div>
      <button class="botao" id="botao-limpar">Limpar filtros</button>
    </div>
  </div>

  <div class="cartao-secao">
    <table>
      <thead><tr><th>Nº</th><th>Cliente</th><th>Data</th><th>Lançado por</th><th>Status</th><th>Nota Fiscal</th><th>Boleto</th><th class="num">Valor</th></tr></thead>
      <tbody id="corpo-tabela"></tbody>
    </table>
    <div id="area-mensagem"></div>
  </div>

  <p class="rodape">Powered by DRAM</p>
</main>

<script>
const SUPABASE_URL = "https://ictjslaiumgaiphkcxdx.supabase.co";
const SUPABASE_KEY = "sb_publishable_Q0mPbsj_qfJ5UqWvvxk2Ww_y2gfm6xX";
const FOCUS_BASE_URL = "https://api.focusnfe.com.br"; // produção (estava apontando pra homologação por engano)
const FUNCTIONS_URL = `${SUPABASE_URL}/functions/v1`;

function obterSessao() {
  try {
    return JSON.parse(localStorage.getItem("dram_auth") || "null");
  } catch {
    return null;
  }
}

async function chamarFunction(nome, corpo) {
  const sessao = obterSessao();
  const resposta = await fetch(`${FUNCTIONS_URL}/${nome}`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": `Bearer ${sessao ? sessao.access_token : SUPABASE_KEY}`,
      "apikey": SUPABASE_KEY,
    },
    body: JSON.stringify(corpo),
  });
  const dados = await resposta.json();
  return { ok: resposta.ok, dados };
}

async function cancelarNotaDoPedido(pedidoId, botao) {
  const justificativa = window.prompt(
    "Motivo do cancelamento (mínimo 15 caracteres). Isso vai cancelar a nota E devolver o estoque:"
  );
  if (!justificativa) return;
  if (justificativa.length < 15) {
    alert("A justificativa precisa ter pelo menos 15 caracteres.");
    return;
  }
  if (!confirm(`Confirma o cancelamento do pedido nº ${pedidoId}? Essa ação não pode ser desfeita.`)) return;

  botao.disabled = true;
  botao.textContent = "Cancelando...";
  try {
    const { ok, dados } = await chamarFunction("cancelar-pedido", { pedido_id: pedidoId, justificativa });
    if (ok) {
      alert("Pedido cancelado com sucesso. O estoque foi devolvido.");
      carregarPedidos();
    } else {
      alert(`Não consegui cancelar: ${dados.erro || JSON.stringify(dados)}`);
      botao.disabled = false;
      botao.textContent = "Cancelar";
    }
  } catch (erro) {
    alert(`Erro: ${erro.message}`);
    botao.disabled = false;
    botao.textContent = "Cancelar";
  }
}

async function chamarSupabase(caminho) {
  const resposta = await fetch(`${SUPABASE_URL}/rest/v1/${caminho}`, {
    headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` },
  });
  if (!resposta.ok) throw new Error(`Erro ${resposta.status}`);
  return resposta.json();
}

function formatarMoeda(valor) {
  return Number(valor).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
}

function dataBrParaIso(texto) {
  const partes = texto.trim().split("/");
  if (partes.length !== 3) return null;
  const [d, m, a] = partes;
  if (!d || !m || !a) return null;
  return `${a.padStart(4, "0")}-${m.padStart(2, "0")}-${d.padStart(2, "0")}`;
}

let pedidos = [];
let notaAutorizadaPorPedido = new Map();
let boletosPorPedido = new Map();

async function carregarPedidos() {
  const corpo = document.getElementById("corpo-tabela");
  const mensagem = document.getElementById("area-mensagem");
  mensagem.innerHTML = `<div class="carregando">Carregando pedidos...</div>`;
  corpo.innerHTML = "";
  try {
    pedidos = await chamarSupabase("pedidos?select=id,total,criado_em,pessoa,status,com_nota_fiscal,clientes(nome)&order=criado_em.desc");
    const notas = await chamarSupabase("notas_fiscais?select=id,pedido_id,status,resposta_bruta&pedido_id=not.is.null&order=criado_em.desc");
    notaAutorizadaPorPedido = new Map();
    for (const n of notas) {
      if (n.status !== "autorizado" && n.status !== "cancelado") continue;
      if (!notaAutorizadaPorPedido.has(n.pedido_id)) notaAutorizadaPorPedido.set(n.pedido_id, n);
    }

    const [boletosBrutos, parcelas] = await Promise.all([
      chamarSupabase("boletos?select=id,pedido_id,pedido_parcela_id,url_boleto,url_pdf,status&status=eq.registrado&order=criado_em"),
      chamarSupabase("pedido_parcelas?select=id,numero_parcela"),
    ]);
    const numeroParcelaPorId = new Map(parcelas.map(p => [p.id, p.numero_parcela]));
    boletosPorPedido = new Map();
    for (const b of boletosBrutos) {
      if (!boletosPorPedido.has(b.pedido_id)) boletosPorPedido.set(b.pedido_id, []);
      boletosPorPedido.get(b.pedido_id).push({ ...b, numero_parcela: numeroParcelaPorId.get(b.pedido_parcela_id) });
    }

    mensagem.innerHTML = "";
    desenharTabela();
  } catch (erro) {
    mensagem.innerHTML = `<div class="erro">Não consegui carregar os pedidos: ${erro.message}</div>`;
  }
}

function desenharTabela() {
  const corpo = document.getElementById("corpo-tabela");
  const mensagem = document.getElementById("area-mensagem");

  const filtroCliente = document.getElementById("filtro-cliente").value.trim().toLowerCase();
  const filtroNumero = document.getElementById("filtro-numero").value.trim();
  const dataDeIso = dataBrParaIso(document.getElementById("filtro-data-de").value);
  const dataAteIso = dataBrParaIso(document.getElementById("filtro-data-ate").value);

  const filtrados = pedidos.filter(p => {
    if (filtroCliente && !p.clientes.nome.toLowerCase().includes(filtroCliente)) return false;
    if (filtroNumero && String(p.id) !== filtroNumero) return false;
    const dataPedidoIso = p.criado_em.slice(0, 10);
    if (dataDeIso && dataPedidoIso < dataDeIso) return false;
    if (dataAteIso && dataPedidoIso > dataAteIso) return false;
    return true;
  });

  if (filtrados.length === 0) {
    corpo.innerHTML = "";
    mensagem.innerHTML = `<div class="vazio">Nenhum pedido encontrado.</div>`;
    return;
  }
  mensagem.innerHTML = "";

  corpo.innerHTML = filtrados.map(p => {
    const data = new Date(p.criado_em);
    const dataTexto = data.toLocaleDateString("pt-BR") + " " + data.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });

    const statusCancelado = p.status === "cancelado";
    const statusTexto = statusCancelado ? "Cancelado" : "Faturado";
    const statusClasse = statusCancelado ? "cancelado" : "faturado";

    let notaTexto = "—";
    let botoesNota = "";
    if (p.com_nota_fiscal) {
      if (statusCancelado) {
        notaTexto = "Cancelada";
      } else {
        const nota = notaAutorizadaPorPedido.get(p.id);
        if (nota && nota.status === "autorizado") {
          notaTexto = `Nº ${(nota.resposta_bruta && nota.resposta_bruta.numero) || "—"}`;
          const caminhoDanfe = nota.resposta_bruta && nota.resposta_bruta.caminho_danfe;
          if (caminhoDanfe) {
            botoesNota += `<a class="botao-nf" href="${FOCUS_BASE_URL}${caminhoDanfe}" target="_blank" rel="noopener">Ver NF</a>`;
          }
          const caminhoXml = nota.resposta_bruta && nota.resposta_bruta.caminho_xml_nota_fiscal;
          if (caminhoXml) {
            botoesNota += `<a class="botao-nf" href="${FOCUS_BASE_URL}${caminhoXml}" target="_blank" rel="noopener" download>XML</a>`;
          }
          botoesNota += `<button type="button" class="botao-nf perigo" data-pedido="${p.id}" data-acao="cancelar-nf">Cancelar</button>`;
        } else if (nota && nota.status === "cancelado") {
          notaTexto = "Cancelada";
        } else {
          notaTexto = "Pendente";
        }
      }
    }

    const boletosDoPedido = boletosPorPedido.get(p.id) || [];
    const botoesBoleto = boletosDoPedido.length === 0
      ? "—"
      : boletosDoPedido.map(b =>
          `<a class="botao-nf" href="${b.url_pdf || b.url_boleto}" target="_blank" rel="noopener">${boletosDoPedido.length > 1 ? `Parcela ${b.numero_parcela || "?"}` : "Ver Boleto"}</a>`
        ).join("");

    return `<tr data-id="${p.id}">
      <td class="numero-pedido">Nº ${p.id}</td>
      <td style="white-space:nowrap">${p.clientes.nome}</td>
      <td>${dataTexto}</td>
      <td class="pessoa">${p.pessoa || "—"}</td>
      <td><span class="selo-status ${statusClasse}">${statusTexto}</span></td>
      <td>${notaTexto}<div class="botoes-nf-linha">${botoesNota}</div></td>
      <td><div class="botoes-nf-linha">${botoesBoleto}</div></td>
      <td class="num">${formatarMoeda(p.total)}</td>
    </tr>`;
  }).join("");

  corpo.querySelectorAll("tr[data-id]").forEach(linha => {
    linha.addEventListener("click", (evento) => {
      if (evento.target.closest(".botao-nf")) return; // nao abre o recibo quando clica nos botoes de nota
      window.open(`recibo-pedido.html?pedido=${linha.dataset.id}`, "_blank");
    });
  });
  corpo.querySelectorAll('[data-acao="cancelar-nf"]').forEach(botao => {
    botao.addEventListener("click", (evento) => {
      evento.stopPropagation();
      cancelarNotaDoPedido(Number(botao.dataset.pedido), botao);
    });
  });
}

document.getElementById("filtro-cliente").addEventListener("input", desenharTabela);
document.getElementById("filtro-numero").addEventListener("input", desenharTabela);
document.getElementById("filtro-data-de").addEventListener("input", desenharTabela);
document.getElementById("filtro-data-ate").addEventListener("input", desenharTabela);
document.getElementById("botao-limpar").addEventListener("click", () => {
  document.getElementById("filtro-cliente").value = "";
  document.getElementById("filtro-numero").value = "";
  document.getElementById("filtro-data-de").value = "";
  document.getElementById("filtro-data-ate").value = "";
  desenharTabela();
});

carregarPedidos();
</script>
</body>
</html>
