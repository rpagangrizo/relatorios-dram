<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DRAM Web - Em Trânsito</title>
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#1B4F72">
<script>
  (function verificarLogin() {
    try {
      var sessao = JSON.parse(localStorage.getItem("dram_auth") || "null");
      if (!sessao || sessao.expira_em <= Date.now()) { window.location.href = "index.html"; }
    } catch (erro) { window.location.href = "index.html"; }
  })();
</script>
<style>
  :root {
    --azul: #1B4F72; --laranja: #D9662F;
    --fundo: #EEF2F4; --papel: #FFFFFF; --texto: #1E2328; --texto-suave: #5C6870;
    --linha: #DCE3E7; --verde: #2F8F4E;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--fundo); color: var(--texto);
    font-family: "IBM Plex Sans", "Segoe UI", Arial, sans-serif; -webkit-font-smoothing: antialiased;
  }
  header { background: var(--azul); color: #fff; padding: 18px 20px 22px; display: flex; align-items: center; gap: 14px; }
  header .logo-caixa { background: #fff; border-radius: 8px; padding: 5px 10px; display: inline-flex; align-items: center; }
  header .logo-caixa img { height: 24px; display: block; }
  header .titulos h1 { font-size: 19px; font-weight: 700; margin: 0; }
  header .titulos p { margin: 2px 0 0; font-size: 12.5px; color: #C9DCEA; }
  main { max-width: 820px; margin: 0 auto; padding: 18px 16px 60px; }

  .secao-titulo { font-size: 13px; font-weight: 700; color: var(--azul); text-transform: uppercase;
    letter-spacing: 0.4px; margin: 0 0 8px 2px; }
  .secao-bloco { margin-bottom: 22px; }

  .cartao { background: var(--papel); border-radius: 12px; border: 1px solid var(--linha); overflow: hidden; overflow-x: auto; }
  table { width: 100%; min-width: 560px; border-collapse: collapse; }
  thead th { text-align: left; font-size: 11px; text-transform: uppercase; color: var(--texto-suave);
    padding: 10px 14px; border-bottom: 1px solid var(--linha); white-space: nowrap; }
  tbody td { padding: 11px 14px; border-bottom: 1px solid var(--linha); font-size: 14px; }
  tbody tr:last-child td { border-bottom: none; }
  td.num { text-align: right; white-space: nowrap; }
  td.saldo { font-weight: 700; color: var(--azul); }

  .vazio, .carregando { padding: 30px 16px; text-align: center; color: var(--texto-suave); font-size: 14px; }
  .rodape { text-align: center; color: #93A0A8; font-size: 11.5px; margin-top: 20px; }
</style>
</head>
<body>

<header>
  <div class="logo-caixa"><img src="logo.png" alt="Arco Íris" onerror="this.parentElement.style.display='none'"></div>
  <div class="titulos"><h1>Em Trânsito</h1><p>Lotes já produzidos, aguardando empacotamento — só consulta</p></div>
</header>
<script src="menu.js"></script>

<main>
  <div id="conteudo" class="carregando">Carregando...</div>

  <p class="rodape">Powered by DRAM</p>
</main>

<script>
const SUPABASE_URL = "https://ictjslaiumgaiphkcxdx.supabase.co";
const SUPABASE_KEY = "sb_publishable_Q0mPbsj_qfJ5UqWvvxk2Ww_y2gfm6xX";

async function chamarSupabase(caminho, opcoes = {}) {
  const resposta = await fetch(`${SUPABASE_URL}/rest/v1/${caminho}`, {
    ...opcoes,
    headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}`, "Content-Type": "application/json", ...(opcoes.headers || {}) },
  });
  if (!resposta.ok) throw new Error(await resposta.text() || `Erro ${resposta.status}`);
  const texto = await resposta.text();
  return texto ? JSON.parse(texto) : null;
}

// categoria_produto_id: 1 = Polpas, 3 = Salgados (Frutas nunca aparece
// aqui, porque nunca passa pela etapa de Produção)
const NOMES_CATEGORIA = { 1: "Polpas", 3: "Salgados" };
const ORDEM_CATEGORIA = [1, 3];

function montarTabela(lotes) {
  let html = `<table><thead><tr>
    <th>Lote</th><th>Item</th><th class="num">Produzido</th><th class="num">Empacotado</th><th class="num">Saldo em Trânsito</th>
  </tr></thead><tbody>`;
  for (const l of lotes) {
    html += `<tr>
      <td>${l.lote}</td>
      <td>${l.item_producao_nome || "—"}</td>
      <td class="num">${Number(l.produzido).toLocaleString("pt-BR")}</td>
      <td class="num">${Number(l.empacotado).toLocaleString("pt-BR")}</td>
      <td class="num saldo">${Number(l.saldo).toLocaleString("pt-BR")}</td>
    </tr>`;
  }
  html += "</tbody></table>";
  return html;
}

async function carregar() {
  const alvo = document.getElementById("conteudo");
  alvo.className = "carregando"; alvo.textContent = "Carregando...";

  try {
    const lotes = await chamarSupabase(
      "saldo_transito_lotes?saldo=gt.0&select=lote,item_producao_nome,categoria_produto_id,produzido,empacotado,saldo&order=lote"
    );

    if (lotes.length === 0) {
      alvo.className = "vazio";
      alvo.textContent = "Nenhum lote em trânsito no momento — tudo que foi produzido já foi empacotado.";
      return;
    }

    let html = "";
    for (const categoriaId of ORDEM_CATEGORIA) {
      const lotesDaCategoria = lotes.filter(l => l.categoria_produto_id === categoriaId);
      if (lotesDaCategoria.length === 0) continue;
      html += `<div class="secao-bloco">
        <p class="secao-titulo">${NOMES_CATEGORIA[categoriaId]}</p>
        <div class="cartao">${montarTabela(lotesDaCategoria)}</div>
      </div>`;
    }
    alvo.className = ""; alvo.innerHTML = html;
  } catch (erro) {
    alvo.className = "vazio"; alvo.textContent = `Não consegui carregar: ${erro.message}`;
  }
}

carregar();
</script>
</body>
</html>
