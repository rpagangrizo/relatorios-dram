<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DRAM Web - Notas Recebidas</title>
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#1B4F72">
<script>
  (function verificarLogin() {
    try {
      var sessao = JSON.parse(localStorage.getItem("dram_auth") || "null");
      if (!sessao || sessao.expira_em <= Date.now()) { window.location.href = "index.html"; }
    } catch (erro) { window.location.href = "index.html"; }
  })();
</script>
<style>
  :root {
    --azul: #1B4F72; --laranja: #D9662F;
    --fundo: #EEF2F4; --papel: #FFFFFF; --texto: #1E2328; --texto-suave: #5C6870; --linha: #DCE3E7;
    --verde: #2F8F4E; --vermelho: #C0392B; --amarelo: #92600C;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fundo); color: var(--texto);
    font-family: "IBM Plex Sans", "Segoe UI", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  header { background: var(--azul); color: #fff; padding: 18px 20px 22px; display: flex; align-items: center; gap: 14px; }
  header .logo-caixa { background: #fff; border-radius: 8px; padding: 5px 10px; display: inline-flex; align-items: center; }
  header .logo-caixa img { height: 24px; display: block; }
  header .titulos h1 { font-size: 19px; font-weight: 700; margin: 0; }
  header .titulos p { margin: 2px 0 0; font-size: 12.5px; color: #C9DCEA; }
  main { max-width: 900px; margin: 0 auto; padding: 18px 16px 60px; }
  .cartao { background: var(--papel); border-radius: 12px; border: 1px solid var(--linha); padding: 16px; margin-bottom: 14px; overflow-x: auto; }
  table { width: 100%; min-width: 640px; border-collapse: collapse; }
  thead th { text-align: left; font-size: 11px; text-transform: uppercase; color: var(--texto-suave); padding: 8px 10px; border-bottom: 1px solid var(--linha); }
  thead th.num { text-align: right; }
  tbody td { padding: 10px; border-bottom: 1px solid var(--linha); font-size: 13.5px; }
  tbody td.num { text-align: right; }
  tbody tr:last-child td { border-bottom: none; }
  .selo { display: inline-block; padding: 3px 9px; border-radius: 100px; font-size: 11px; font-weight: 700; }
  .selo.completo { background: #E4F3E8; color: var(--verde); }
  .selo.ciencia_dada { background: #FFF3E0; color: var(--amarelo); }
  .selo.resumo { background: #EEF2F4; color: var(--texto-suave); }
  .selo.erro { background: #FBE7E4; color: var(--vermelho); }
  a.link-danfe { color: var(--azul); font-weight: 700; text-decoration: none; font-size: 13px; }
  a.link-danfe:hover { text-decoration: underline; }
  .vazio, .carregando { padding: 30px; text-align: center; color: var(--texto-suave); font-size: 14px; }
  .aviso-topo { background: #EAF1F6; color: var(--azul); border-radius: 9px; padding: 12px 14px; font-size: 13px; margin-bottom: 14px; }
  .rodape { text-align: center; color: #93A0A8; font-size: 11.5px; margin-top: 20px; }
</style>
</head>
<body>

<header>
  <div class="logo-caixa"><img src="logo.png" alt="Arco Íris" onerror="this.parentElement.style.display='none'"></div>
  <div class="titulos"><h1>Notas Recebidas</h1><p>Notas fiscais emitidas contra o CNPJ da Arco Íris</p></div>
</header>
<script src="menu.js"></script>

<main>
  <p class="aviso-topo">Essa lista é atualizada automaticamente 1x por dia, direto com a SEFAZ. Não é possível "atualizar agora" — é uma regra da própria SEFAZ, contra uso abusivo desse tipo de consulta.</p>

  <div class="cartao">
    <div id="conteudo-tabela" class="carregando">Carregando...</div>
  </div>

  <p class="rodape">Powered by DRAM</p>
</main>

<script>
const SUPABASE_URL = "https://ictjslaiumgaiphkcxdx.supabase.co";
const SUPABASE_KEY = "sb_publishable_Q0mPbsj_qfJ5UqWvvxk2Ww_y2gfm6xX";

async function chamarSupabase(caminho) {
  const resposta = await fetch(`${SUPABASE_URL}/rest/v1/${caminho}`, { headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` } });
  if (!resposta.ok) throw new Error(`Erro ${resposta.status}`);
  return resposta.json();
}
function formatarMoeda(v) { return Number(v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" }); }
function formatarData(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  return d.toLocaleDateString("pt-BR");
}
const ROTULOS_STATUS = {
  completo: "Pronta", ciencia_dada: "Aguardando XML", resumo: "Aguardando ciência", erro: "Erro",
};

async function carregar() {
  const alvo = document.getElementById("conteudo-tabela");
  try {
    const notas = await chamarSupabase("notas_recebidas?select=id,chave_acesso,emitente_nome,emitente_cnpj,valor_total,data_emissao,status&order=data_emissao.desc");
    if (notas.length === 0) {
      alvo.className = "vazio";
      alvo.textContent = "Nenhuma nota encontrada ainda. A primeira consulta automática vai trazer o histórico disponível.";
      return;
    }
    let html = `<table><thead><tr><th>Emitente</th><th>CNPJ</th><th>Emissão</th><th class="num">Valor</th><th>Status</th><th></th></tr></thead><tbody>`;
    for (const n of notas) {
      const podeVerDanfe = n.status === "completo";
      html += `<tr>
        <td>${n.emitente_nome || "—"}</td>
        <td>${n.emitente_cnpj || "—"}</td>
        <td>${formatarData(n.data_emissao)}</td>
        <td class="num">${formatarMoeda(n.valor_total)}</td>
        <td><span class="selo ${n.status}">${ROTULOS_STATUS[n.status] || n.status}</span></td>
        <td>${podeVerDanfe ? `<a class="link-danfe" href="danfe-recebida.html?id=${n.id}" target="_blank">Ver DANFE</a>` : ""}</td>
      </tr>`;
    }
    html += "</tbody></table>";
    alvo.className = ""; alvo.innerHTML = html;
  } catch (erro) {
    alvo.className = "vazio"; alvo.textContent = `Não consegui carregar: ${erro.message}`;
  }
}

carregar();
</script>
</body>
</html>
