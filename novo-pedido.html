<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DRAM Web - Novo Pedido</title>
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#1B4F72">
<style>
  :root {
    --azul: #1B4F72; --laranja: #D9662F; --laranja-escuro: #B84F1F;
    --fundo: #EEF2F4; --papel: #FFFFFF; --texto: #1E2328; --texto-suave: #5C6870;
    --linha: #DCE3E7; --verde: #2F8F4E; --vermelho: #C0392B;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fundo); color: var(--texto);
    font-family: "IBM Plex Sans", "Segoe UI", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  header { background: var(--azul); color: #fff; padding: 18px 20px 22px; display: flex; align-items: center; gap: 14px; }
  header .logo-caixa { background: #fff; border-radius: 8px; padding: 5px 10px; display: inline-flex; align-items: center; }
  header .logo-caixa img { height: 24px; display: block; }
  header .titulos h1 { font-size: 19px; font-weight: 700; margin: 0; }
  header .titulos p { margin: 2px 0 0; font-size: 12.5px; color: #C9DCEA; }
  main { max-width: 760px; margin: 0 auto; padding: 18px 16px 80px; }

  .passo { background: var(--papel); border-radius: 12px; border: 1px solid var(--linha); padding: 16px; margin-bottom: 14px; }
  .passo.desabilitado { opacity: 0.45; pointer-events: none; }
  .passo h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--texto-suave); margin: 0 0 10px; }

  input[type=text], input[type=number] {
    width: 100%; padding: 12px 14px; border-radius: 9px; border: 1.5px solid var(--linha);
    font-size: 14.5px; color: var(--texto); background: #fff;
  }
  input:focus { outline: none; border-color: var(--azul); }

  .lista-produtos { max-height: 220px; overflow-y: auto; margin-top: 8px; border-radius: 9px; border: 1px solid var(--linha); }
  .item-produto { padding: 11px 14px; border-bottom: 1px solid var(--linha); cursor: pointer; font-size: 14px; display: flex; justify-content: space-between; }
  .item-produto:last-child { border-bottom: none; }
  .item-produto:hover { background: #F6F9FA; }
  .item-produto .saldo-atual { color: var(--texto-suave); font-size: 12.5px; }
  .item-produto.zerado .saldo-atual { color: var(--vermelho); font-weight: 700; }

  .selecionado-caixa { margin-top: 10px; padding: 12px 14px; border-radius: 9px; background: #EAF1F6; border: 1.5px solid var(--azul); display: none; }
  .selecionado-caixa .nome { font-weight: 700; color: var(--azul); font-size: 14.5px; }
  .chips-info { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip-info { background: #fff; border: 1px solid var(--linha); border-radius: 100px; padding: 5px 11px; font-size: 12px; color: var(--texto-suave); }

  .opcoes-deposito { display: flex; flex-direction: column; gap: 8px; }
  .opcao-deposito { text-align: left; padding: 12px 14px; border-radius: 9px; border: 1.5px solid var(--linha);
    background: #fff; font-size: 14.5px; font-weight: 600; color: var(--texto); cursor: pointer; }
  .opcao-deposito.ativa { border-color: var(--azul); background: #EAF1F6; color: var(--azul); }

  table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  thead th { text-align: left; font-size: 11px; text-transform: uppercase; color: var(--texto-suave); padding: 8px 6px; border-bottom: 1px solid var(--linha); }
  thead th.num { text-align: center; }
  tbody td { padding: 9px 6px; border-bottom: 1px solid var(--linha); font-size: 13.5px; vertical-align: middle; }
  tbody td.num { text-align: center; white-space: nowrap; }
  tbody tr.linha-erro { background: #FBE7E4; }
  .aviso-linha { color: var(--vermelho); font-size: 11px; margin-top: 2px; }
  .campo-tabela { width: 78px; padding: 7px 8px; font-size: 13.5px; text-align: center; }
  .botao-remover { background: none; border: none; color: var(--vermelho); font-size: 18px; cursor: pointer; padding: 0 6px; }

  .botao { padding: 12px 18px; border-radius: 9px; border: none; background: var(--laranja); color: #fff;
    font-size: 14.5px; font-weight: 700; cursor: pointer; }
  .botao:active { background: var(--laranja-escuro); }
  .botao:disabled { background: #C9CFD3; cursor: not-allowed; }

  .total-caixa { display: flex; justify-content: space-between; align-items: center;
    background: #F6F9FA; border-radius: 9px; padding: 12px 14px; margin-top: 10px; font-size: 15px; font-weight: 700; display: none; }
  .total-caixa .valor { color: var(--azul); font-size: 18px; }

  .mensagem { margin-top: 14px; padding: 13px 15px; border-radius: 9px; font-size: 14px; font-weight: 600; display: none; }
  .mensagem.sucesso { display: block; background: #E4F3E8; color: var(--verde); }
  .mensagem.erro { display: block; background: #FBE7E4; color: var(--vermelho); }

  .aviso-pessoa { background: #FFF3E0; color: #92600C; border-radius: 9px; padding: 11px 14px; font-size: 13.5px; margin-bottom: 14px; }
  .rodape { text-align: center; color: #93A0A8; font-size: 11.5px; margin-top: 20px; }
  .barra-final { position: sticky; bottom: 0; background: var(--papel); border-top: 1px solid var(--linha);
    padding: 14px 16px; margin: 14px -16px -16px; border-radius: 0 0 12px 12px; }
  a.link-discreto { color: var(--azul); font-size: 13.5px; text-decoration: none; font-weight: 700; }
</style>
</head>
<body>

<header>
  <div class="logo-caixa"><img src="logo.png" alt="Arco Íris" onerror="this.parentElement.style.display='none'"></div>
  <div class="titulos">
    <h1>Novo Pedido</h1>
    <p id="texto-pessoa">Identificando...</p>
  </div>
</header>

<main>
  <div id="aviso-pessoa" class="aviso-pessoa" style="display:none">
    Não identifiquei quem está fazendo esse pedido pelo link. Confirme seu nome abaixo antes de continuar.
    <div style="margin-top:8px"><input type="text" id="campo-pessoa-manual" placeholder="Seu nome"></div>
  </div>

  <div class="passo" id="passo-cliente">
    <h2>1. Cliente</h2>
    <input type="text" id="campo-busca-cliente" placeholder="Buscar cliente...">
    <div class="lista-produtos" id="lista-clientes"></div>
    <div class="selecionado-caixa" id="caixa-cliente-selecionado">
      <div class="nome" id="nome-cliente-selecionado"></div>
      <div class="chips-info" id="chips-cliente-info"></div>
    </div>
  </div>

  <div class="passo desabilitado" id="passo-deposito">
    <h2>2. De qual depósito sai essa venda?</h2>
    <div class="opcoes-deposito" id="opcoes-deposito"></div>
  </div>

  <div class="passo desabilitado" id="passo-itens">
    <h2>3. Itens do pedido</h2>
    <input type="text" id="campo-busca-produto" placeholder="Buscar produto pra adicionar...">
    <div class="lista-produtos" id="lista-produtos"></div>

    <table id="tabela-itens-pedido" style="display:none">
      <thead><tr><th>Item</th><th class="num">Qtd.</th><th class="num">Preço</th><th class="num">Subtotal</th><th></th></tr></thead>
      <tbody id="corpo-itens-pedido"></tbody>
    </table>
    <div class="total-caixa" id="total-caixa">
      <span>Total do pedido</span>
      <span class="valor" id="valor-total-pedido">R$ 0,00</span>
    </div>
  </div>

  <div class="barra-final">
    <button class="botao" id="botao-confirmar" disabled>Confirmar Pedido</button>
    <div class="mensagem" id="mensagem"></div>
  </div>

  <p class="rodape">Powered by DRAM</p>
</main>

<script>
const SUPABASE_URL = "https://ictjslaiumgaiphkcxdx.supabase.co";
const SUPABASE_KEY = "sb_publishable_Q0mPbsj_qfJ5UqWvvxk2Ww_y2gfm6xX";
const FORMAS_PAGAMENTO = { boleto: "Boleto", pix: "PIX", deposito: "Depósito" };

const parametros = new URLSearchParams(window.location.search);
let pessoa = parametros.get("pessoa");
const textoPessoa = document.getElementById("texto-pessoa");
const avisoPessoa = document.getElementById("aviso-pessoa");
if (pessoa) {
  textoPessoa.textContent = `Lançado por ${pessoa}`;
} else {
  textoPessoa.textContent = "Identificação não encontrada";
  avisoPessoa.style.display = "block";
  document.getElementById("campo-pessoa-manual").addEventListener("input", (e) => {
    pessoa = e.target.value.trim() || null;
  });
}

async function chamarSupabase(caminho, opcoes = {}) {
  const resposta = await fetch(`${SUPABASE_URL}/rest/v1/${caminho}`, {
    ...opcoes,
    headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}`, "Content-Type": "application/json", ...(opcoes.headers || {}) },
  });
  if (!resposta.ok) {
    const corpoErro = await resposta.text();
    throw new Error(corpoErro || `Erro ${resposta.status}`);
  }
  const texto = await resposta.text();
  return texto ? JSON.parse(texto) : null;
}

let clientes = [];
let depositos = [];
let itensCatalogo = [];
let clienteEscolhido = null;
let depositoEscolhidoId = null;
let saldosEstoque = new Map();
let precosTabela = new Map();
let itensPedido = [];

async function iniciar() {
  [clientes, depositos] = await Promise.all([
    chamarSupabase("clientes?select=id,nome,tabela_preco_id,forma_pagamento,prazo_dias,parcelas&order=nome"),
    chamarSupabase("depositos?select=id,nome&order=id"),
  ]);
  desenharOpcoesDeposito();
}

function desenharListaClientes(filtro) {
  const alvo = document.getElementById("lista-clientes");
  if (!filtro) { alvo.innerHTML = ""; return; }
  const filtrados = clientes.filter(c => c.nome.toLowerCase().includes(filtro.toLowerCase()));
  if (filtrados.length === 0) {
    alvo.innerHTML = `<div class="item-produto">Nenhum cliente encontrado.</div>`;
    return;
  }
  alvo.innerHTML = filtrados.slice(0, 30).map(c =>
    `<div class="item-produto" data-id="${c.id}">${c.nome}</div>`
  ).join("");
  alvo.querySelectorAll(".item-produto[data-id]").forEach(linha => {
    linha.addEventListener("click", () => escolherCliente(Number(linha.dataset.id)));
  });
}
document.getElementById("campo-busca-cliente").addEventListener("input", (e) => desenharListaClientes(e.target.value));

async function escolherCliente(id) {
  clienteEscolhido = clientes.find(c => c.id === id);
  document.getElementById("campo-busca-cliente").value = "";
  document.getElementById("lista-clientes").innerHTML = "";
  document.getElementById("nome-cliente-selecionado").textContent = clienteEscolhido.nome;

  const chips = [];
  if (clienteEscolhido.forma_pagamento) chips.push(FORMAS_PAGAMENTO[clienteEscolhido.forma_pagamento] || clienteEscolhido.forma_pagamento);
  if (clienteEscolhido.prazo_dias) chips.push(`Prazo: ${clienteEscolhido.prazo_dias} dia(s)`);
  if (clienteEscolhido.parcelas && clienteEscolhido.parcelas > 1) chips.push(`${clienteEscolhido.parcelas}x`);
  document.getElementById("chips-cliente-info").innerHTML =
    (chips.length ? chips : ["Sem forma de pagamento cadastrada"]).map(c => `<span class="chip-info">${c}</span>`).join("");
  document.getElementById("caixa-cliente-selecionado").style.display = "block";

  document.getElementById("passo-deposito").classList.remove("desabilitado");

  precosTabela.clear();
  if (clienteEscolhido.tabela_preco_id) {
    const precos = await chamarSupabase(`tabela_preco_itens?select=item_id,preco&tabela_id=eq.${clienteEscolhido.tabela_preco_id}`);
    for (const p of precos) if (p.preco !== null) precosTabela.set(p.item_id, Number(p.preco));
  }
  for (const item of itensPedido) {
    if (precosTabela.has(item.item_id)) item.preco_unitario = precosTabela.get(item.item_id);
  }
  desenharTabelaItensPedido();
  atualizarBotaoConfirmar();
}

function desenharOpcoesDeposito() {
  const alvo = document.getElementById("opcoes-deposito");
  alvo.innerHTML = depositos.map(d => `<button class="opcao-deposito" data-id="${d.id}">${d.nome}</button>`).join("");
  alvo.querySelectorAll(".opcao-deposito").forEach(botao => {
    botao.addEventListener("click", () => escolherDeposito(botao));
  });
}

async function escolherDeposito(botao) {
  document.querySelectorAll(".opcao-deposito").forEach(b => b.classList.remove("ativa"));
  botao.classList.add("ativa");
  depositoEscolhidoId = Number(botao.dataset.id);
  document.getElementById("passo-itens").classList.remove("desabilitado");

  if (itensCatalogo.length === 0) {
    itensCatalogo = await chamarSupabase("itens?select=id,nome&order=nome");
  }
  const saldos = await chamarSupabase(`estoque_produto_acabado?select=item_id,quantidade&deposito_id=eq.${depositoEscolhidoId}`);
  saldosEstoque = new Map(saldos.map(s => [s.item_id, Number(s.quantidade)]));
  desenharListaProdutosParaAdicionar("");
  desenharTabelaItensPedido();
  atualizarBotaoConfirmar();
}

function desenharListaProdutosParaAdicionar(filtro) {
  const alvo = document.getElementById("lista-produtos");
  if (!filtro) { alvo.innerHTML = ""; return; }
  const filtrados = itensCatalogo.filter(i => i.nome.toLowerCase().includes(filtro.toLowerCase()));
  if (filtrados.length === 0) {
    alvo.innerHTML = `<div class="item-produto">Nenhum produto encontrado.</div>`;
    return;
  }
  alvo.innerHTML = filtrados.slice(0, 40).map(i => {
    const saldo = saldosEstoque.get(i.id) || 0;
    return `<div class="item-produto ${saldo <= 0 ? 'zerado' : ''}" data-id="${i.id}" data-nome="${i.nome}">
      <span>${i.nome}</span><span class="saldo-atual">${saldo} em estoque</span></div>`;
  }).join("");
  alvo.querySelectorAll(".item-produto[data-id]").forEach(linha => {
    linha.addEventListener("click", () => adicionarItemAoPedido(Number(linha.dataset.id), linha.dataset.nome));
  });
}
document.getElementById("campo-busca-produto").addEventListener("input", (e) => desenharListaProdutosParaAdicionar(e.target.value));

function adicionarItemAoPedido(itemId, nome) {
  if (itensPedido.some(i => i.item_id === itemId)) return;
  const precoSugerido = precosTabela.get(itemId) ?? 0;
  itensPedido.push({ item_id: itemId, nome, quantidade: 1, preco_unitario: precoSugerido });
  document.getElementById("campo-busca-produto").value = "";
  document.getElementById("lista-produtos").innerHTML = "";
  desenharTabelaItensPedido();
}

function desenharTabelaItensPedido() {
  const tabela = document.getElementById("tabela-itens-pedido");
  const totalCaixa = document.getElementById("total-caixa");
  const corpo = document.getElementById("corpo-itens-pedido");

  if (itensPedido.length === 0) {
    tabela.style.display = "none";
    totalCaixa.style.display = "none";
    atualizarBotaoConfirmar();
    return;
  }
  tabela.style.display = "table";
  totalCaixa.style.display = "flex";

  corpo.innerHTML = itensPedido.map((item, indice) => {
    const saldo = saldosEstoque.get(item.item_id) || 0;
    const excede = item.quantidade > saldo;
    return `
    <tr class="${excede ? 'linha-erro' : ''}">
      <td>${item.nome}${excede ? `<div class="aviso-linha">Só tem ${saldo} em estoque</div>` : ""}</td>
      <td class="num"><input type="number" min="0.01" step="0.01" class="campo-tabela" data-campo="quantidade" data-indice="${indice}" value="${item.quantidade}"></td>
      <td class="num"><input type="number" min="0" step="0.01" class="campo-tabela" data-campo="preco_unitario" data-indice="${indice}" value="${item.preco_unitario}" placeholder="0,00"></td>
      <td class="num">R$ ${(item.quantidade * (item.preco_unitario || 0)).toFixed(2).replace(".", ",")}</td>
      <td><button class="botao-remover" data-indice="${indice}">✕</button></td>
    </tr>`;
  }).join("");

  corpo.querySelectorAll(".campo-tabela").forEach(campo => {
    campo.addEventListener("input", () => {
      const indice = Number(campo.dataset.indice);
      const valor = parseFloat(campo.value) || 0;
      itensPedido[indice][campo.dataset.campo] = valor;
      desenharTabelaItensPedido();
    });
  });
  corpo.querySelectorAll(".botao-remover").forEach(botao => {
    botao.addEventListener("click", () => {
      itensPedido.splice(Number(botao.dataset.indice), 1);
      desenharTabelaItensPedido();
    });
  });

  const total = itensPedido.reduce((soma, i) => soma + i.quantidade * (i.preco_unitario || 0), 0);
  document.getElementById("valor-total-pedido").textContent = "R$ " + total.toFixed(2).replace(".", ",");
  atualizarBotaoConfirmar();
}

function algumItemExcedeEstoque() {
  return itensPedido.some(i => (saldosEstoque.get(i.item_id) || 0) < i.quantidade);
}

function atualizarBotaoConfirmar() {
  const tudoPreenchido = clienteEscolhido && depositoEscolhidoId && pessoa &&
    itensPedido.length > 0 && itensPedido.every(i => i.quantidade > 0 && i.preco_unitario >= 0) &&
    !algumItemExcedeEstoque();
  document.getElementById("botao-confirmar").disabled = !tudoPreenchido;
}

document.getElementById("botao-confirmar").addEventListener("click", async () => {
  const botao = document.getElementById("botao-confirmar");
  const mensagem = document.getElementById("mensagem");
  botao.disabled = true;
  botao.textContent = "Salvando...";
  mensagem.className = "mensagem";

  try {
    const numeroPedido = await chamarSupabase("rpc/confirmar_pedido", {
      method: "POST",
      body: JSON.stringify({
        p_cliente_id: clienteEscolhido.id,
        p_deposito_id: depositoEscolhidoId,
        p_forma_pagamento: clienteEscolhido.forma_pagamento || null,
        p_prazo_dias: clienteEscolhido.prazo_dias || null,
        p_parcelas: clienteEscolhido.parcelas || 1,
        p_itens: itensPedido.map(i => ({ item_id: i.item_id, quantidade: i.quantidade, preco_unitario: i.preco_unitario })),
      }),
    });
    mensagem.className = "mensagem sucesso";
    mensagem.innerHTML = `Pedido nº ${numeroPedido} confirmado! <a class="link-discreto" href="recibo-pedido.html?pedido=${numeroPedido}" target="_blank">Ver / Imprimir recibo</a>`;

    itensPedido = [];
    clienteEscolhido = null;
    depositoEscolhidoId = null;
    document.getElementById("caixa-cliente-selecionado").style.display = "none";
    document.querySelectorAll(".opcao-deposito").forEach(b => b.classList.remove("ativa"));
    document.getElementById("passo-deposito").classList.add("desabilitado");
    document.getElementById("passo-itens").classList.add("desabilitado");
    desenharTabelaItensPedido();
  } catch (erro) {
    mensagem.className = "mensagem erro";
    mensagem.textContent = `Não consegui confirmar: ${erro.message}`;
  } finally {
    botao.textContent = "Confirmar Pedido";
    atualizarBotaoConfirmar();
  }
});

iniciar();
</script>
</body>
</html>
