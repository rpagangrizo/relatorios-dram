<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DRAM Web - Diário de Produção</title>
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#1B4F72">
<script>
  (function verificarLogin() {
    try {
      var sessao = JSON.parse(localStorage.getItem("dram_auth") || "null");
      if (!sessao || sessao.expira_em <= Date.now()) { window.location.href = "index.html"; }
    } catch (erro) { window.location.href = "index.html"; }
  })();
</script>
<style>
  :root {
    --azul: #1B4F72; --laranja: #D9662F;
    --fundo: #EEF2F4; --papel: #FFFFFF; --texto: #1E2328; --texto-suave: #5C6870;
    --linha: #DCE3E7; --verde: #2F8F4E;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--fundo); color: var(--texto);
    font-family: "IBM Plex Sans", "Segoe UI", Arial, sans-serif; -webkit-font-smoothing: antialiased;
  }
  header { background: var(--azul); color: #fff; padding: 18px 20px 22px; display: flex; align-items: center; gap: 14px; }
  header .logo-caixa { background: #fff; border-radius: 8px; padding: 5px 10px; display: inline-flex; align-items: center; }
  header .logo-caixa img { height: 24px; display: block; }
  header .titulos h1 { font-size: 19px; font-weight: 700; margin: 0; }
  header .titulos p { margin: 2px 0 0; font-size: 12.5px; color: #C9DCEA; }
  main { max-width: 720px; margin: 0 auto; padding: 18px 16px 60px; }

  .barra-periodo { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
  .barra-periodo select {
    padding: 10px 12px; border-radius: 9px; border: 1.5px solid var(--linha);
    font-size: 14px; color: var(--texto); background: #fff;
  }

  .dia-bloco { margin-bottom: 18px; }
  .dia-titulo { font-size: 13px; font-weight: 700; color: var(--azul); text-transform: uppercase;
    letter-spacing: 0.4px; margin: 0 0 8px 2px; }
  .cartao { background: var(--papel); border-radius: 12px; border: 1px solid var(--linha); overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  thead th { text-align: left; font-size: 11px; text-transform: uppercase; color: var(--texto-suave);
    padding: 9px 14px; border-bottom: 1px solid var(--linha); white-space: nowrap; }
  tbody td { padding: 10px 14px; border-bottom: 1px solid var(--linha); font-size: 14px; }
  tbody tr:last-child td { border-bottom: none; }
  td.num { text-align: right; white-space: nowrap; }

  .vazio, .carregando { padding: 30px 16px; text-align: center; color: var(--texto-suave); font-size: 14px; }
  .rodape { text-align: center; color: #93A0A8; font-size: 11.5px; margin-top: 20px; }
</style>
</head>
<body>

<header>
  <div class="logo-caixa"><img src="logo.png" alt="Arco Íris" onerror="this.parentElement.style.display='none'"></div>
  <div class="titulos"><h1>Diário de Produção</h1><p>O que foi produzido, dia após dia (só apontamentos já aprovados)</p></div>
</header>
<script src="menu.js"></script>

<main>
  <div class="barra-periodo">
    <select id="select-mes"></select>
    <select id="select-ano"></select>
  </div>

  <div id="conteudo-diario" class="carregando">Carregando...</div>

  <p class="rodape">Powered by DRAM</p>
</main>

<script>
const SUPABASE_URL = "https://ictjslaiumgaiphkcxdx.supabase.co";
const SUPABASE_KEY = "sb_publishable_Q0mPbsj_qfJ5UqWvvxk2Ww_y2gfm6xX";

async function chamarSupabase(caminho, opcoes = {}) {
  const resposta = await fetch(`${SUPABASE_URL}/rest/v1/${caminho}`, {
    ...opcoes,
    headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}`, "Content-Type": "application/json", ...(opcoes.headers || {}) },
  });
  if (!resposta.ok) throw new Error(await resposta.text() || `Erro ${resposta.status}`);
  const texto = await resposta.text();
  return texto ? JSON.parse(texto) : null;
}

const NOMES_MESES = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const NOMES_DIAS_SEMANA = ["Domingo","Segunda-feira","Terça-feira","Quarta-feira","Quinta-feira","Sexta-feira","Sábado"];

function montarSeletorPeriodo() {
  const hoje = new Date();
  const seletorMes = document.getElementById("select-mes");
  const seletorAno = document.getElementById("select-ano");

  seletorMes.innerHTML = NOMES_MESES.map((nome, indice) => `<option value="${indice + 1}">${nome}</option>`).join("");
  seletorMes.value = hoje.getMonth() + 1;

  const anoAtual = hoje.getFullYear();
  const anos = [];
  for (let ano = anoAtual; ano >= anoAtual - 3; ano--) anos.push(ano);
  seletorAno.innerHTML = anos.map(ano => `<option value="${ano}">${ano}</option>`).join("");
  seletorAno.value = anoAtual;

  seletorMes.addEventListener("change", carregar);
  seletorAno.addEventListener("change", carregar);
}

function formatarDataCompleta(dataIso) {
  const [ano, mes, dia] = dataIso.split("-").map(Number);
  const dataLocal = new Date(ano, mes - 1, dia);
  const nomeDiaSemana = NOMES_DIAS_SEMANA[dataLocal.getDay()];
  return `${nomeDiaSemana}, ${String(dia).padStart(2, "0")}/${String(mes).padStart(2, "0")}/${ano}`;
}

let itensCatalogo = [];
function nomeItem(id) { return itensCatalogo.find(i => i.id === id)?.nome || "—"; }

async function carregar() {
  const alvo = document.getElementById("conteudo-diario");
  alvo.className = "carregando"; alvo.textContent = "Carregando...";

  const mes = Number(document.getElementById("select-mes").value);
  const ano = Number(document.getElementById("select-ano").value);
  const inicioMes = `${ano}-${String(mes).padStart(2, "0")}-01`;
  const dataProximoMes = mes === 12 ? new Date(ano + 1, 0, 1) : new Date(ano, mes, 1);
  const inicioProximoMes = `${dataProximoMes.getFullYear()}-${String(dataProximoMes.getMonth() + 1).padStart(2, "0")}-01`;

  try {
    const [itensResp, apontamentosResp] = await Promise.all([
      chamarSupabase("itens?select=id,nome&order=nome"),
      chamarSupabase(
        `apontamentos_producao?status=eq.aprovado&select=item_id,quantidade,lote,criado_em` +
        `&criado_em=gte.${inicioMes}&criado_em=lt.${inicioProximoMes}&order=criado_em.desc`
      ),
    ]);
    itensCatalogo = itensResp;
    desenharDiario(apontamentosResp);
  } catch (erro) {
    alvo.className = "vazio"; alvo.textContent = `Não consegui carregar: ${erro.message}`;
  }
}

function desenharDiario(apontamentos) {
  const alvo = document.getElementById("conteudo-diario");

  if (apontamentos.length === 0) {
    alvo.className = "vazio"; alvo.textContent = "Nenhum apontamento aprovado nesse mês.";
    return;
  }

  // agrupa por dia (data local, sem hora) - a consulta ja vem ordenada
  // por criado_em decrescente, entao os grupos ja saem do dia mais
  // recente pro mais antigo
  const gruposPorDia = [];
  const indicePorDia = {};
  for (const a of apontamentos) {
    const dataIso = new Date(a.criado_em).toLocaleDateString("sv-SE"); // "AAAA-MM-DD" no fuso local do navegador
    if (!(dataIso in indicePorDia)) {
      indicePorDia[dataIso] = gruposPorDia.length;
      gruposPorDia.push({ data: dataIso, linhas: [] });
    }
    gruposPorDia[indicePorDia[dataIso]].linhas.push(a);
  }

  let html = "";
  for (const grupo of gruposPorDia) {
    html += `<div class="dia-bloco">
      <p class="dia-titulo">${formatarDataCompleta(grupo.data)}</p>
      <div class="cartao"><table>
        <thead><tr><th>Item</th><th>Lote</th><th class="num">Quantidade</th></tr></thead>
        <tbody>`;
    for (const linha of grupo.linhas) {
      html += `<tr>
        <td>${nomeItem(linha.item_id)}</td>
        <td>${linha.lote || "—"}</td>
        <td class="num">${Number(linha.quantidade).toLocaleString("pt-BR")} cx</td>
      </tr>`;
    }
    html += `</tbody></table></div></div>`;
  }
  alvo.className = ""; alvo.innerHTML = html;
}

montarSeletorPeriodo();
carregar();
</script>
</body>
</html>
