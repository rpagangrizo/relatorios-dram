<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DRAM Web - Transportadoras</title>
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#1B4F72">
<script>
  (function verificarLogin() {
    try {
      var sessao = JSON.parse(localStorage.getItem("dram_auth") || "null");
      if (!sessao || sessao.expira_em <= Date.now()) { window.location.href = "index.html"; }
    } catch (erro) { window.location.href = "index.html"; }
  })();
</script>
<style>
  :root {
    --azul: #1B4F72; --laranja: #D9662F; --laranja-escuro: #B84F1F;
    --fundo: #EEF2F4; --papel: #FFFFFF; --texto: #1E2328; --texto-suave: #5C6870; --linha: #DCE3E7;
    --verde: #2F8F4E; --vermelho: #C0392B;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fundo); color: var(--texto);
    font-family: "IBM Plex Sans", "Segoe UI", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  header { background: var(--azul); color: #fff; padding: 18px 20px 22px; display: flex; align-items: center; gap: 14px; }
  header .logo-caixa { background: #fff; border-radius: 8px; padding: 5px 10px; display: inline-flex; align-items: center; }
  header .logo-caixa img { height: 24px; display: block; }
  header .titulos h1 { font-size: 19px; font-weight: 700; margin: 0; }
  header .titulos p { margin: 2px 0 0; font-size: 12.5px; color: #C9DCEA; }

  main { max-width: 800px; margin: 0 auto; padding: 18px 16px 60px; }

  .cartao { background: var(--papel); border-radius: 12px; border: 1px solid var(--linha); padding: 16px; margin-bottom: 14px; }
  .cartao h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--texto-suave); margin: 0 0 10px; }

  .grade-form { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 10px; }
  @media (max-width: 720px) { .grade-form { grid-template-columns: 1fr 1fr; } }
  .campo { display: flex; flex-direction: column; gap: 4px; }
  .campo label { font-size: 11px; text-transform: uppercase; color: var(--texto-suave); letter-spacing: 0.4px; }
  .campo input { padding: 10px 12px; border-radius: 9px; border: 1.5px solid var(--linha); font-size: 14px; color: var(--texto); background: #fff; }
  .campo input:focus { outline: none; border-color: var(--azul); }

  .botao { padding: 10px 16px; border-radius: 9px; border: none; background: var(--laranja); color: #fff; font-size: 13.5px; font-weight: 700; cursor: pointer; }
  .botao:active { background: var(--laranja-escuro); }
  .botao:disabled { background: #C9CFD3; cursor: not-allowed; }
  .botao.secundario { background: #fff; border: 1.5px solid var(--azul); color: var(--azul); }

  table { width: 100%; border-collapse: collapse; }
  thead th { text-align: left; font-size: 11px; text-transform: uppercase; color: var(--texto-suave); padding: 8px 10px; border-bottom: 1px solid var(--linha); white-space: nowrap; }
  tbody td { padding: 9px 10px; border-bottom: 1px solid var(--linha); font-size: 13.5px; cursor: pointer; }
  tbody tr:hover { background: #F6F9FA; }
  tbody tr.ativo { background: #EAF1F6; }
  tbody tr:last-child td { border-bottom: none; }
  .barra-busca { margin-bottom: 10px; }
  .barra-busca input { width: 100%; padding: 12px 14px; border-radius: 9px; border: 1.5px solid var(--linha); font-size: 14.5px; }
  .barra-acoes { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }

  .mensagem { margin-top: 10px; padding: 11px 14px; border-radius: 9px; font-size: 13.5px; font-weight: 600; display: none; }
  .mensagem.sucesso { display: block; background: #E4F3E8; color: var(--verde); }
  .mensagem.erro { display: block; background: #FBE7E4; color: var(--vermelho); }

  .vazio, .carregando { padding: 20px; text-align: center; color: var(--texto-suave); font-size: 14px; }
  .rodape { text-align: center; color: #93A0A8; font-size: 11.5px; margin-top: 20px; }
</style>
</head>
<body>

<header>
  <div class="logo-caixa"><img src="logo.png" alt="Arco Íris" onerror="this.parentElement.style.display='none'"></div>
  <div class="titulos">
    <h1>Transportadoras</h1>
    <p>Dados que saem na nota fiscal quando tem transportador</p>
  </div>
</header>
<script src="menu.js"></script>

<main>
  <div class="cartao">
    <h2 id="titulo-formulario">Nova transportadora / editar selecionada</h2>
    <div class="grade-form">
      <div class="campo" style="grid-column: span 2">
        <label>Nome / Razão social</label>
        <input type="text" id="campo-nome">
      </div>
      <div class="campo">
        <label>Inscrição Estadual</label>
        <input type="text" id="campo-ie">
      </div>
      <div class="campo">
        <label>CNPJ</label>
        <input type="text" id="campo-cnpj" placeholder="00.000.000/0000-00">
      </div>
      <div class="campo">
        <label>CPF (se pessoa física)</label>
        <input type="text" id="campo-cpf" placeholder="000.000.000-00">
      </div>
      <div class="campo">
        <label>RNTC (ANTT)</label>
        <input type="text" id="campo-rntc">
      </div>
      <div class="campo" style="grid-column: span 2">
        <label>Endereço</label>
        <input type="text" id="campo-endereco" placeholder="Rua, número, bairro">
      </div>
      <div class="campo">
        <label>Município</label>
        <input type="text" id="campo-municipio">
      </div>
      <div class="campo">
        <label>UF</label>
        <input type="text" id="campo-uf" maxlength="2" placeholder="SP">
      </div>
    </div>
    <div style="display:flex; gap:8px">
      <button class="botao" id="botao-salvar">Salvar</button>
      <button class="botao secundario" id="botao-cancelar-edicao">Cancelar edição</button>
    </div>
    <div class="mensagem" id="mensagem-formulario"></div>
  </div>

  <div class="cartao">
    <h2>Transportadoras cadastradas</h2>
    <div class="barra-busca"><input type="text" id="campo-busca" placeholder="Buscar transportadora..."></div>
    <div id="conteudo-tabela" class="carregando">Carregando...</div>
    <div class="barra-acoes">
      <button class="botao secundario" id="botao-editar" disabled>Editar selecionada</button>
      <button class="botao secundario" id="botao-excluir" disabled style="border-color:var(--vermelho); color:var(--vermelho)">Excluir selecionada</button>
    </div>
  </div>

  <p class="rodape">Powered by DRAM</p>
</main>

<script>
const SUPABASE_URL = "https://ictjslaiumgaiphkcxdx.supabase.co";
const SUPABASE_KEY = "sb_publishable_Q0mPbsj_qfJ5UqWvvxk2Ww_y2gfm6xX";

async function chamarSupabase(caminho, opcoes = {}) {
  const resposta = await fetch(`${SUPABASE_URL}/rest/v1/${caminho}`, {
    ...opcoes,
    headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}`, "Content-Type": "application/json", ...(opcoes.headers || {}) },
  });
  if (!resposta.ok) {
    const corpoErro = await resposta.text();
    throw new Error(corpoErro || `Erro ${resposta.status}`);
  }
  const texto = await resposta.text();
  return texto ? JSON.parse(texto) : null;
}

let transportadoras = [];
let selecionadaId = null;
let emEdicaoId = null; // null = cadastrando nova

async function carregarDados() {
  transportadoras = await chamarSupabase("transportadoras?select=id,nome,cnpj,cpf,inscricao_estadual,endereco,municipio,uf,rntc&order=nome");
  desenharTabela(document.getElementById("campo-busca").value);
}

function desenharTabela(filtro) {
  const alvo = document.getElementById("conteudo-tabela");
  const filtradas = transportadoras.filter(t => t.nome.toLowerCase().includes((filtro || "").toLowerCase()));
  if (filtradas.length === 0) {
    alvo.className = "vazio"; alvo.textContent = "Nenhuma transportadora encontrada."; return;
  }
  let html = `<table><thead><tr><th>Nome</th><th>CNPJ/CPF</th><th>Cidade/UF</th></tr></thead><tbody>`;
  for (const t of filtradas) {
    const ativo = t.id === selecionadaId ? "ativo" : "";
    const doc = t.cnpj || t.cpf || "—";
    const local = [t.municipio, t.uf].filter(Boolean).join("/") || "—";
    html += `<tr class="${ativo}" data-id="${t.id}"><td>${t.nome}</td><td>${doc}</td><td>${local}</td></tr>`;
  }
  html += `</tbody></table>`;
  alvo.className = ""; alvo.innerHTML = html;
  alvo.querySelectorAll("tbody tr").forEach(tr => {
    tr.addEventListener("click", () => selecionar(Number(tr.dataset.id)));
  });
}

function selecionar(id) {
  selecionadaId = selecionadaId === id ? null : id;
  desenharTabela(document.getElementById("campo-busca").value);
  const temSelecao = selecionadaId !== null;
  document.getElementById("botao-editar").disabled = !temSelecao;
  document.getElementById("botao-excluir").disabled = !temSelecao;
}
document.getElementById("campo-busca").addEventListener("input", (e) => desenharTabela(e.target.value));

function limparFormulario() {
  emEdicaoId = null;
  document.getElementById("titulo-formulario").textContent = "Nova transportadora / editar selecionada";
  ["nome", "cnpj", "cpf", "ie", "rntc", "endereco", "municipio", "uf"].forEach(campo => {
    document.getElementById(`campo-${campo}`).value = "";
  });
  document.getElementById("mensagem-formulario").className = "mensagem";
}
document.getElementById("botao-cancelar-edicao").addEventListener("click", limparFormulario);

document.getElementById("botao-editar").addEventListener("click", () => {
  const t = transportadoras.find(x => x.id === selecionadaId);
  if (!t) return;
  emEdicaoId = t.id;
  document.getElementById("titulo-formulario").textContent = `Editando: ${t.nome}`;
  document.getElementById("campo-nome").value = t.nome || "";
  document.getElementById("campo-cnpj").value = t.cnpj || "";
  document.getElementById("campo-cpf").value = t.cpf || "";
  document.getElementById("campo-ie").value = t.inscricao_estadual || "";
  document.getElementById("campo-rntc").value = t.rntc || "";
  document.getElementById("campo-endereco").value = t.endereco || "";
  document.getElementById("campo-municipio").value = t.municipio || "";
  document.getElementById("campo-uf").value = t.uf || "";
  window.scrollTo({ top: 0, behavior: "smooth" });
});

document.getElementById("botao-salvar").addEventListener("click", async () => {
  const mensagem = document.getElementById("mensagem-formulario");
  const nome = document.getElementById("campo-nome").value.trim();
  if (!nome) { mensagem.className = "mensagem erro"; mensagem.textContent = "Informe o nome."; return; }

  const payload = {
    nome,
    cnpj: document.getElementById("campo-cnpj").value.trim() || null,
    cpf: document.getElementById("campo-cpf").value.trim() || null,
    inscricao_estadual: document.getElementById("campo-ie").value.trim() || null,
    rntc: document.getElementById("campo-rntc").value.trim() || null,
    endereco: document.getElementById("campo-endereco").value.trim() || null,
    municipio: document.getElementById("campo-municipio").value.trim() || null,
    uf: document.getElementById("campo-uf").value.trim().toUpperCase() || null,
  };

  const botao = document.getElementById("botao-salvar");
  botao.disabled = true; botao.textContent = "Salvando...";
  try {
    if (emEdicaoId) {
      await chamarSupabase(`transportadoras?id=eq.${emEdicaoId}`, { method: "PATCH", body: JSON.stringify(payload) });
    } else {
      await chamarSupabase("transportadoras", { method: "POST", body: JSON.stringify(payload) });
    }
    limparFormulario();
    await carregarDados();
    mensagem.className = "mensagem sucesso"; mensagem.textContent = "Salvo com sucesso!";
  } catch (erro) {
    mensagem.className = "mensagem erro"; mensagem.textContent = `Não consegui salvar: ${erro.message}`;
  } finally {
    botao.disabled = false; botao.textContent = "Salvar";
  }
});

document.getElementById("botao-excluir").addEventListener("click", async () => {
  const t = transportadoras.find(x => x.id === selecionadaId);
  if (!t) return;
  if (!confirm(`Excluir "${t.nome}"?\n\nNão é possível se ela já tiver sido usada em algum pedido.`)) return;
  try {
    await chamarSupabase(`transportadoras?id=eq.${t.id}`, { method: "DELETE" });
    selecionadaId = null;
    await carregarDados();
  } catch (erro) {
    alert(erro.message.includes("23503") || erro.message.toLowerCase().includes("foreign key")
      ? `"${t.nome}" já foi usada em algum pedido e não pode ser excluída.`
      : `Não consegui excluir: ${erro.message}`);
  }
});

carregarDados();
</script>
</body>
</html>
